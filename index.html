function buildTrendCards(){
  const wrap=el("div","trends");
  const cmp=dayAlignedComparison(4);
  const trail=trailingTotals(6);

  const card=(label,val,subHtml,cls,estimated)=>{
    const c=el("div","trend-card "+(cls||"neutral"));
    c.appendChild(el("div","tc-label",label));
    const v=el("div","tc-val",val);
    if(estimated){ const b=el("span","tc-est","est"); v.appendChild(b); }
    c.appendChild(v);
    const s=el("div","tc-sub"); s.innerHTML=subHtml; c.appendChild(s);
    return c;
  };
  const dir=(cur,base,higherBetter=true)=>{
    if(!base) return "neutral";
    if(Math.abs(cur-base)/Math.max(base,1e-9)<0.03) return "neutral";
    return (cur>base)===higherBetter?"up":"down";
  };
  const upto=`by <b>${cmp.dayName}</b>`;

  if(!allActivities.length){
    wrap.appendChild(card("Weekly load","—","Connect Strava to see training data","neutral"));
    return wrap;
  }

  // 1. Hours — this week big, 4-wk day-aligned average small (your notes #14 + #16)
  {
    const d=pctDelta(cmp.cur.hrs,cmp.avg.hrs);
    wrap.appendChild(card("Training load",fmtHrs(cmp.cur.hrs),
      `${upto} · 4-wk avg <b>${fmtHrs(cmp.avg.hrs)}</b>`+(d!==null?` · ${signed(d)}%`:""),
      dir(cmp.cur.hrs,cmp.avg.hrs,true)));
  }
  // 2. Calories
  {
    const d=pctDelta(cmp.cur.kcal,cmp.avg.kcal);
    wrap.appendChild(card("Calories",cmp.cur.kcal?Math.round(cmp.cur.kcal).toLocaleString():"—",
      `${upto} · 4-wk avg <b>${Math.round(cmp.avg.kcal).toLocaleString()}</b>`+(d!==null?` · ${signed(d)}%`:""),
      dir(cmp.cur.kcal,cmp.avg.kcal,true), cmp.cur.kcalIsEstimate));
  }
  // 3. Run pace — this week big, trailing 6-wk small. Lower is better.
  {
    const cs=paceToSec(cmp.cur.runPace), ts=paceToSec(trail.runPace);
    let cls="neutral";
    if(cs&&ts) cls=cs<ts?"up":"down";
    wrap.appendChild(card("Run pace",cmp.cur.runPace,
      `min/km this week · 6-wk avg <b>${trail.runPace}</b>`,cls));
  }
  // 4. Swim pace
  {
    const cs=paceToSec(cmp.cur.swimPace), ts=paceToSec(trail.swimPace);
    let cls="neutral";
    if(cs&&ts) cls=cs<ts?"up":"down";
    wrap.appendChild(card("Swim pace",cmp.cur.swimPace,
      `/100m this week · 6-wk avg <b>${trail.swimPace}</b>`,cls));
  }
  // 5. Bike power
  {
    const c=cmp.cur.avgPower, t=trail.avgPower;
    wrap.appendChild(card("Bike power",c?c+"W":"—",
      `this week · 6-wk avg <b>${t?t+"W":"—"}</b>`,dir(c,t,true)));
  }
  // 6. Easy share (v36) — the share of measured time spent genuinely easy.
  {
    const c=cmp.cur.easyPct, base=cmp.avg.easyPct, t=trail.easyPct;
    // Colour against the 80% target, not against last month. Drifting from
    // 30% to 35% is not "up" in any sense that matters.
    let cls="neutral";
    if(c!=null) cls = c>=EASY_TARGET_PCT ? "up" : (c<60?"down":"neutral");
    const parts=[`of measured time · target <b>${EASY_TARGET_PCT}%</b>`];
    if(t!=null) parts.push(`6-wk <b>${t}%</b>`);
    else if(base!=null) parts.push(`4-wk <b>${base}%</b>`);
    wrap.appendChild(card("Easy share",c!=null?c+"%":"—",parts.join(" · "),cls));
  }
  return wrap;
}

/**
 * Intensity distribution (v36) — this week and the trailing 6 weeks, with the
 * 80/20 reference. Answers the one question a weekly hours figure cannot:
 * is the easy work actually easy?
 */
function buildIntensityPanel(iso){
  const p=el("div","panel");
  p.appendChild(Object.assign(el("h3"),{textContent:"Intensity distribution"}));

  if(!allActivities.length){
    p.appendChild(el("div","muted","Connect Strava to see intensity data."));
    return p;
  }

  const bar=(t,label)=>{
    const box=el("div");
    const head=el("div","int-target");
    if(t.easyPct==null){
      head.textContent=label+" — no heart-rate data";
      box.appendChild(head);
      return box;
    }
    head.innerHTML=`<b>${esc(label)}</b> · ${fmtHrs(t.hrSecs/3600)} measured`+
      (t.hrCoveragePct!=null&&t.hrCoveragePct<100
        ? ` · ${t.hrCoveragePct}% of session time had a strap` : "");
    box.appendChild(head);

    const b=el("div","int-bar");
    [["easy",t.easyPct,"int-easy"],["mod",t.modPct,"int-mod"],["hard",t.hardPct,"int-hard"]]
      .forEach(([k,pct,cls])=>{
        if(!pct) return;                        // 0% segments would render as slivers
        const seg=el("div","int-seg "+cls,pct>=8?pct+"%":"");
        seg.style.width=pct+"%";
        seg.title=k+": "+pct+"%";
        b.appendChild(seg);
      });
    box.appendChild(b);
    return box;
  };

  // Same partial-week window as the trend cards above, so the two agree.
  const trail=trailingTotals(TRAIL_WEEKS);
  p.appendChild(bar(weekToDateTotals(),"This week so far"));
  p.appendChild(bar(trail,`Trailing ${TRAIL_WEEKS} weeks`));

  const lg=el("div","int-legend");
  const eM=hrEasyMax(), hM=hrHardMin();
  // hM is guaranteed > eM, but they can be adjacent, which leaves no moderate
  // band at all — printing "Moderate 141-140" would look like a bug.
  const modLabel = hM-eM>1 ? `Moderate ${eM+1}\u2013${hM-1}` : "Moderate — none (bands adjacent)";
  lg.innerHTML=
    `<div><span class="k" style="background:var(--good)"></span>Easy \u2264${eM} bpm</div>`+
    `<div><span class="k" style="background:var(--warn)"></span>${modLabel}</div>`+
    `<div><span class="k" style="background:var(--bad)"></span>Hard \u2265${hM} bpm</div>`;
  p.appendChild(lg);

  // Per-discipline easy share over the same trailing window — a single overall
  // figure hides the problem, because one sport can be fine while another is
  // entirely in the red.
  const mon=mondayOf(new Date());
  const trailActs=actsBetween(addDays(mon,-7*TRAIL_WEEKS),mon);
  const rows=[];
  [["run",RUN_TYPES],["bike",BIKE_TYPES],["swim",SWIM_TYPES]].forEach(([d,types])=>{
    const t=computeTotals(trailActs.filter(a=>types.has(sportOf(a))));
    if(t.easyPct!=null) rows.push([DISC[d].label,t.easyPct,t.hrSecs/3600]);
  });
  if(rows.length){
    const tb=el("table","dtable");
    tb.innerHTML=`<thead><tr><th>${TRAIL_WEEKS}-wk by sport</th><th>Easy</th><th>Hours w/ HR</th></tr></thead>`;
    const body=el("tbody");
    rows.forEach(([l,pct,hrs])=>{
      const tr=el("tr");
      const col=pct>=EASY_TARGET_PCT?"var(--good)":(pct<40?"var(--bad)":"var(--warn)");
      tr.innerHTML=`<td>${esc(l)}</td>`+
        `<td style="color:${col};font-weight:700">${pct}%</td>`+
        `<td>${fmtHrs(hrs)}</td>`;
      body.appendChild(tr);
    });
    tb.appendChild(body); p.appendChild(tb);
  }

  const note=el("div","int-note");
  note.textContent=
    "How this is measured: Strava reports one average heart rate per activity, not a "+
    "zone histogram, so each session is classified by its average and the whole session "+
    "counts toward that bucket. This reads HARSHER than a true time-in-zone figure — a "+
    "run averaging 165 counts as fully hard here, while a watch would credit the "+
    "warm-up and cool-down minutes as easy. Do not compare these percentages to the "+
    "ones in Garmin; compare them to last month's. The metric still answers the "+
    "question it exists for, because a genuinely easy session has a genuinely low "+
    "average and will land in the easy bucket. Thresholds are editable from the header.";
  p.appendChild(note);
  return p;
}

/** Returns the week-cards container so callers can place it anywhere in the page. */
function buildWeekCards(isoList){
  const c=el("div","weeks");
  c.id="weeks";                       // isEditing() looks this up
  (isoList||[]).forEach(iso=>{
    // Rendering must not mutate state. A transient week object is rendered for a
    // date that has no record yet; it only becomes real when the user edits it.
    const w=getWeek(iso)||normWeek({date:iso},iso);
    c.appendChild(weekCard(w));
  });
  return c;
}
function weekCard(w){
  // Weeks are never collapsible — always fully expanded, per the "no collapsible
  // weeks" note. This also removes a whole class of stale-state bugs.
  const box=el("div","week");
  box.dataset.week=w.date;

  /* head — built with DOM nodes, never innerHTML (closes the v34 injection vector) */
  const head=el("div","wk-head");
  const dwrap=el("div");
  dwrap.appendChild(el("div","wk-date",weekLabel(w.date)));
  dwrap.appendChild(el("div","wk-sub",dateFromISO(w.date)?dateFromISO(w.date).getFullYear():""));
  head.appendChild(dwrap);

  const meta=el("div","wk-meta");
  const a=adherence(w);
  if(a.total) meta.appendChild(el("span","wk-progress",`${a.done}/${a.total}`));
  head.appendChild(meta);
  box.appendChild(head);

  const body=el("div","wk-body");
  const cols=el("div","wk-cols");

  /* left — plan */
  const L=el("div");
  L.appendChild(el("div","wk-col-head","Planned"));
  const list=el("div","plan");
  w.planned.forEach(p=>list.appendChild(plannedRow(p)));
  L.appendChild(list);
  const add=el("button","add-sess","+ session");
  add.dataset.action="add-sess";
  L.appendChild(add);
  cols.appendChild(L);

  /* right — Strava */
  const R=el("div");
  const acts=weekActivities(w.date);
  R.appendChild(el("div","wk-col-head","Strava"+(stravaToken?` (${acts.length})`:"")));
  const ac=el("div","strava-activities");
  if(!stravaToken) ac.appendChild(el("div","strava-loading","Connect Strava to sync."));
  else if(!acts.length) ac.appendChild(el("div","strava-loading","No activities this week."));
  acts.forEach(x=>ac.appendChild(activityCard(x)));
  R.appendChild(ac);
  cols.appendChild(R);
  body.appendChild(cols);

  /* comments */
  const cw=el("div","comments-wrap");
  const cl=el("div","wk-col-head","Comments");
  cl.style.marginTop="14px";
  cw.appendChild(cl);
  const ta=el("textarea");
  ta.dataset.field="comments";
  ta.placeholder="How the week felt…";
  ta.value=w.comments||"";
  ta.addEventListener("input",()=>autoGrow(ta));
  cw.appendChild(ta);
  requestAnimationFrame(()=>autoGrow(ta));
  body.appendChild(cw);

  /* habits — now available on every week */
  body.appendChild(habitsTable(w));

  box.appendChild(body);
  return box;
}

function weekActivities(iso){

/** Which intensity bucket a single activity's average HR falls in (v36). */
function hrZoneOf(a){
  const hr=a&&a.average_heartrate;
  if(!(hr>0)) return null;
  if(hr<=hrEasyMax()) return {key:"easy",label:"EASY",cls:"z-easy"};
  if(hr>=hrHardMin()) return {key:"hard",label:"HARD",cls:"z-hard"};
  return {key:"mod",label:"MOD",cls:"z-mod"};
}
function activityCard(a){
  const sport=a.sport_type||a.type||"Workout";
  const card=el("div","act-card");
  const bar=el("div","act-disc"); bar.style.background=discColor(sport);
  card.appendChild(bar);

  const bd=el("div","act-body");
  bd.appendChild(el("div","act-name",a.name||sport));
  const meta=el("div","act-meta");

  const dist=a.distance||0, time=a.moving_time||0, elev=a.total_elevation_gain||0;
  const hr=a.average_heartrate||null;
  const cal=activityCalories(a);

  const stat=(v,l,est)=>{
    const s=el("span","act-stat"+(est?" est":""));
    const b=el("b",null,v); s.appendChild(b);
    s.appendChild(document.createTextNode(" "+l));
    return s;
  };
  if(dist>0) meta.appendChild(stat(fmtDist(dist,sport),"dist"));
  if(time>0) meta.appendChild(stat(fmtTime(time),"time"));
  if(elev>10) meta.appendChild(stat(Math.round(elev)+"m","elev"));
  if(hr){
    const z=hrZoneOf(a);
    const s=stat(Math.round(hr)+" bpm","HR");
    if(z){
      const chip=el("span","zchip "+z.cls,z.label);
      chip.title="Average HR "+Math.round(hr)+" bpm · easy \u2264"+hrEasyMax()+
                 ", hard \u2265"+hrHardMin();
      s.appendChild(chip);
    }
    meta.appendChild(s);
  }
  if(cal.kcal>0) meta.appendChild(stat(cal.kcal+" kcal",cal.est?"est":"cal",cal.est));
  if(RUN_TYPES.has(sport)&&dist>0&&time>0) meta.appendChild(stat(fmtPace(dist,time)+"/km","pace"));
  if(SWIM_TYPES.has(sport)&&dist>0&&time>0) meta.appendChild(stat(fmtPaceSwim(dist,time)+"/100m","pace"));
  if(a.average_watts>0&&BIKE_TYPES.has(sport)) meta.appendChild(stat(Math.round(a.average_watts)+"W","pwr"));
  bd.appendChild(meta);
  card.appendChild(bd);

  const d=actDate(a);
  card.appendChild(el("div","act-date",d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric"})));
  return card;
}

/* week actions */
document.addEventListener("click",e=>{
  const act=e.target.closest("[data-action]");
  if(!act) return;
  const a=act.dataset.action;

  const weekEl=act.closest("[data-week]");
  if(!weekEl) return;
  // Explicit user action on this week — materialise it if it was only a placeholder.
  const w=ensureWeek(weekEl.dataset.week);
  if(!w) return;

  if(a==="toggle"){
    const row=act.closest("[data-item]"); if(!row) return;
    const it=w.planned.find(p=>p.id===row.dataset.item); if(!it) return;
    it.done=act.checked;
    row.classList.toggle("done",it.done);
    refreshProgress(weekEl,w);
    schedule();
  }
  else if(a==="cycle"){
    const row=act.closest("[data-item]"); if(!row) return;
    const it=w.planned.find(p=>p.id===row.dataset.item); if(!it) return;
    const ci=CYCLE.indexOf(it.disc);
    it.disc=CYCLE[ci<0?0:(ci+1)%CYCLE.length];   // unknown disc -> start of cycle
    const d=discMeta(it.disc);
    act.style.background=d.c; act.textContent=d.label;
    refreshProgress(weekEl,w);
    schedule();
  }
  else if(a==="del-sess"){
    const row=act.closest("[data-item]"); if(!row) return;
    w.planned=w.planned.filter(p=>p.id!==row.dataset.item);
    row.remove();
    refreshProgress(weekEl,w);
    schedule();
  }
  else if(a==="add-sess"){
    const it={id:uid(),disc:"run",text:"",done:false};
    w.planned.push(it);
    const list=weekEl.querySelector(".plan");
    if(list){
      const row=plannedRow(it);
      list.appendChild(row);
      const inp=row.querySelector(".ptext"); if(inp) inp.focus();
    }
    refreshProgress(weekEl,w);
    schedule();
  }
});
/** Update only the affected bits — avoids destroying in-flight edits (fixes M7). */
function refreshProgress(weekEl,w){
  const a=adherence(w);
  const pr=weekEl.querySelector(".wk-progress");
  if(!a.total){ if(pr) pr.remove(); return; }      // no countable sessions -> no badge
  if(pr) pr.textContent=`${a.done}/${a.total}`;
  else{
    const meta=weekEl.querySelector(".wk-meta");
    if(meta) meta.insertBefore(el("span","wk-progress",`${a.done}/${a.total}`),meta.firstChild);
  }
}

/**
 * Every metric, rolled up monthly, alongside the raw stores — so an export is
 * self-sufficient for analysis without re-deriving anything.
 */
function exportMetricSeries(){
  const buckets=buildBuckets("all","month");
  const out={};
  METRIC_KEYS.forEach(k=>{
    const m=METRICS[k];
    const series=metricSeries(k,buckets);
    if(!series.some(v=>v!=null)) return;
    const byMonth={};
    buckets.forEach((b,i)=>{ if(series[i]!=null) byMonth[b.key]=+series[i].toFixed(4); });
    out[k]={label:m.label,group:m.group,src:m.src,unit:m.unit||null,
            agg:m.src==="derived"?"recomputed":(m.agg||null),months:byMonth};
  });
  return out;
}
function exportJSON(){

    const t=totalsForWeek(iso), a=adherence(weeks[iso]), h=habitTotals(weeks[iso]);
    months[mk].weeks.push({

      bikeKm:+t.bikeKm.toFixed(2), runKm:+t.runKm.toFixed(2), swimM:Math.round(t.swimM),
      sessions:t.count, avgPower:t.avgPower, avgHr:t.avgHr,

      cigarettes:h.anyRecorded?h.cigs:null, drinks:h.anyRecorded?h.drinks:null
    });
  });
  const payload={
    exportedAt:new Date().toISOString(),
    schemaVersion:SCHEMA_VERSION,
    state,                       // raw weeks, settings — full fidelity
    metrics,                     // v37 wellness store, imported + hand-entered
    derived:{months,metrics:exportMetricSeries()},
    calorieCache:calCache,

  const url=URL.createObjectURL(blob);

  a.href=url;
  a.download=`training-log-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.json`;
  document.body.appendChild(a); a.click();

}

/* ════════════════════════════════════════════════════════════
   IMPORT (v36) — merge a plan file into state.weeks
   Accepts a bare weeks map {"2026-08-17":{...}}, a full export payload
   ({state:{weeks:{...}}}), or a loose {weeks:{...}}.

   Deliberately narrow: for a week that already exists this replaces `planned`
   and NOTHING else. Comments and habit entries are yours, written by hand, and
   a plan file has no business touching them — so importing the wrong file
   costs you a plan, never your notes.
   ════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════
   GARMIN .ZIP -> METRICS  (v37)
   A Garmin Connect export is a zip of JSON files. Reading it here means there
   is no offline conversion step. No library: the central directory is a simple
   binary format and DecompressionStream("deflate-raw") is native. Only the
   handful of files that carry metrics are inflated, so a 27 MB export costs a
   fraction of that in work.
   ════════════════════════════════════════════════════════════ */
async function inflateRaw(bytes){
  if(typeof DecompressionStream==="undefined")
    throw new Error("This browser cannot unzip. Use the offline converter, or import a metrics JSON.");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
/** Minimal zip reader: central directory only, no ZIP64, no encryption. */
async function openZip(file){
  const buf=await file.arrayBuffer();
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  // The EOCD sits at the end, after a comment of up to 64 KB.
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("Not a readable zip file.");
  const count=dv.getUint16(eocd+10,true);
  let cd=dv.getUint32(eocd+16,true);
  if(count===0xFFFF||cd===0xFFFFFFFF)
    throw new Error("ZIP64 archives are not supported. Unzip it and import the metrics JSON instead.");
  const dec=new TextDecoder();
  const entries=[];
  for(let i=0;i<count;i++){
    if(dv.getUint32(cd,true)!==0x02014b50) break;
    const method=dv.getUint16(cd+10,true);
    const compSize=dv.getUint32(cd+20,true);
    const nameLen=dv.getUint16(cd+28,true);
    const extraLen=dv.getUint16(cd+30,true);
    const commentLen=dv.getUint16(cd+32,true);
    const offset=dv.getUint32(cd+42,true);
    const name=dec.decode(u8.subarray(cd+46,cd+46+nameLen));
    entries.push({name,method,compSize,offset});
    cd+=46+nameLen+extraLen+commentLen;
  }
  async function read(entry){
    if(dv.getUint32(entry.offset,true)!==0x04034b50) throw new Error("Corrupt entry: "+entry.name);
    const nameLen=dv.getUint16(entry.offset+26,true);
    const extraLen=dv.getUint16(entry.offset+28,true);
    const start=entry.offset+30+nameLen+extraLen;
    const raw=u8.subarray(start,start+entry.compSize);
    if(entry.method===0) return raw;
    if(entry.method===8) return await inflateRaw(raw);
    throw new Error("Unsupported compression in "+entry.name);
  }
  async function readJSON(entry){
    const bytes=await read(entry);
    const text=new TextDecoder("utf-8").decode(bytes).replace(/^\uFEFF/,"");
    if(!text.trim()) return null;
    try{ return JSON.parse(text); }catch(e){ return null; }
  }
  return {entries,read,readJSON};
}

/* Intraday reduction, mirroring the offline converter exactly. Readiness is a
   wake-up number and Garmin rewrites it downward as you train, so averaging a
   day understates it badly; VO2max takes the most recent reading. */
const GARMIN_INTRADAY={vo2max:"last",vo2maxBike:"last",readiness:"first",
  ctl:"last",atl:"last",acwr:"last",steps:"max",activeKcal:"max",totalKcal:"max",
  vigorousMin:"max",moderateMin:"max",sweatLossMl:"sum",weightKg:"last",bmi:"last",
  bioAge:"last",pred5kSec:"last",pred10kSec:"last",predHMSec:"last",predMSec:"last"};

/**
 * Garmin's calendarDate arrives three ways: an ISO string, an epoch in ms
 * (MetricsAcuteTrainingLoad), or a formatted GMT string. The epoch form is
 * UTC MIDNIGHT, so reading it with local date parts shifts every record back a
 * day in any timezone behind UTC — which silently mislabelled 394 training-load
 * values when tested in America/New_York. Always resolve to the UTC date.
 */
function garminISO(v){
  const utcISO=d=>isNaN(d)?null:d.getUTCFullYear()+"-"+pad2(d.getUTCMonth()+1)+"-"+pad2(d.getUTCDate());
  if(v==null) return null;
  if(typeof v==="string"){
    const t=v.trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0,10);   // already a plain date
    return utcISO(new Date(t));
  }
  let n=num(v); if(n===null) return null;
  if(n>1e11) n/=1000;
  if(n<1e8) return null;
  return utcISO(new Date(n*1000));
}

async function garminZipToMetrics(zip,progress){
  const bag={};                                  // iso -> key -> [values]
  const prov={};
  const add=(iso,key,value,fileName,srcLabel)=>{
    if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
    const v=num(value); if(v===null) return;
    if(!bag[iso]) bag[iso]={};
    if(!bag[iso][key]) bag[iso][key]=[];
    bag[iso][key].push(v);
    prov[key]={src:srcLabel||"garmin",file:fileName,intraday:GARMIN_INTRADAY[key]||"mean"};
  };
  const pick=rx=>zip.entries.filter(e=>rx.test(e.name.split("/").pop()));
  const each=async(rx,fn)=>{
    for(const e of pick(rx)){
      if(progress) progress(e.name.split("/").pop());
      const d=await zip.readJSON(e);
      if(!d) continue;
      const arr=Array.isArray(d)?d:[d];
      for(const r of arr){ if(r&&typeof r==="object") fn(r,e.name.split("/").pop()); }
    }
  };

  await each(/MetricsMaxMetData.*\.json$/i,(r,f)=>{
    const iso=garminISO(r.calendarDate);
    const key=String(r.sport||"").toUpperCase()==="CYCLING"?"vo2maxBike":"vo2max";
    add(iso,key,r.vo2MaxValue,f);
  });
  await each(/UDSFile.*\.json$/i,(r,f)=>{
    const iso=garminISO(r.calendarDate); if(!iso) return;
    add(iso,"rhr",r.restingHeartRate,f);
    add(iso,"steps",r.totalSteps,f);
    add(iso,"activeKcal",r.activeKilocalories,f);
    add(iso,"totalKcal",r.totalKilocalories,f);
    add(iso,"vigorousMin",r.vigorousIntensityMinutes,f);
    add(iso,"moderateMin",r.moderateIntensityMinutes,f);
    const list=(r.allDayStress&&r.allDayStress.aggregatorList)||[];
    for(const a of list){
      if(a&&a.type==="TOTAL"){
        const lvl=num(a.averageStressLevel);
        if(lvl!==null&&lvl>=0) add(iso,"stressAvg",lvl,f);
        break;
      }
    }
    const bb=r.bodyBattery||{};
    add(iso,"bbCharged",bb.chargedValue,f);
    add(iso,"bbDrained",bb.drainedValue,f);
  });
  await each(/sleepData\.json$/i,(r,f)=>{
    const iso=garminISO(r.calendarDate); if(!iso) return;
    const secs=(num(r.deepSleepSeconds)||0)+(num(r.lightSleepSeconds)||0)+(num(r.remSleepSeconds)||0);
    if(secs>3600){                               // ignore stubs and naps
      add(iso,"sleepH",secs/3600,f);
      add(iso,"sleepDeepMin",(num(r.deepSleepSeconds)||0)/60,f);
      add(iso,"sleepRemMin",(num(r.remSleepSeconds)||0)/60,f);
    }
    add(iso,"sleepScore",r.sleepScores&&r.sleepScores.overallScore,f);
    add(iso,"sleepStress",r.avgSleepStress,f);
  });
  await each(/healthStatusData\.json$/i,(r,f)=>{
    const iso=garminISO(r.calendarDate); if(!iso) return;
    const MAP={HRV:"hrv",RESPIRATION:"respiration",SKIN_TEMP_C:"skinTempDelta"};
    for(const m of (r.metrics||[])){
      const k=MAP[m&&m.type]; if(k) add(iso,k,m.value,f);
    }
  });
  await each(/MetricsAcuteTrainingLoad.*\.json$/i,(r,f)=>{
    const iso=garminISO(r.calendarDate); if(!iso) return;
    add(iso,"atl",r.dailyTrainingLoadAcute,f);
    add(iso,"ctl",r.dailyTrainingLoadChronic,f);
    add(iso,"acwr",r.dailyAcuteChronicWorkloadRatio,f);
  });
  await each(/TrainingReadinessDTO.*\.json$/i,(r,f)=>{
    const iso=garminISO(r.calendarDate); if(!iso) return;
    add(iso,"readiness",r.score,f);
    add(iso,"hrvWeekly",r.hrvWeeklyAverage,f);
  });
  await each(/RunRacePredictions.*\.json$/i,(r,f)=>{
    const iso=garminISO(r.calendarDate); if(!iso) return;
    add(iso,"pred5kSec",r.raceTime5K,f);
    add(iso,"pred10kSec",r.raceTime10K,f);
    add(iso,"predHMSec",r.raceTimeHalf,f);
    add(iso,"predMSec",r.raceTimeMarathon,f);
  });
  // Weight is not a series in the export, but BMI is and height is, so weight
  // is recoverable. Provenance says so rather than pretending it was measured.
  let heightCm=null;
  await each(/userBioMetricProfileData\.json$/i,r=>{ heightCm=num(r.height)||heightCm; });
  await each(/fitnessAgeData\.json$/i,(r,f)=>{
    const iso=garminISO(r.asOfDateGmt); if(!iso) return;
    const bmi=num(r.bmi);
    add(iso,"bmi",bmi,f);
    add(iso,"bioAge",r.currentBioAge,f);
    if(bmi!==null&&heightCm) add(iso,"weightKg",bmi*Math.pow(heightCm/100,2),f,"garmin:bmi*height");
  });
  await each(/HydrationLogFile.*\.json$/i,(r,f)=>{
    const iso=garminISO(r.calendarDate); const loss=num(r.estimatedSweatLossInML);
    if(!iso||loss===null) return;
    add(iso,"sweatLossMl",loss,f);
    const dur=num(r.duration);
    if(dur&&dur>1800) add(iso,"sweatRateMlH",loss/(dur/3600),f);
  });

  const days={};
  Object.keys(bag).sort().forEach(iso=>{
    const row={};
    Object.keys(bag[iso]).forEach(k=>{
      const v=aggregate(bag[iso][k],GARMIN_INTRADAY[k]||"mean");
      if(v!==null) row[k]=Math.round(v*1000)/1000;
    });
    if(Object.keys(row).length) days[iso]=row;
  });
  const sources={};
  Object.keys(prov).forEach(k=>{
    const ds=Object.keys(days).filter(d=>days[d][k]!=null).sort();
    if(!ds.length) return;
    const span=Math.round((dateFromISO(ds[ds.length-1])-dateFromISO(ds[0]))/86400000)+1;
    sources[k]={src:prov[k].src,file:prov[k].file,days:ds.length,from:ds[0],to:ds[ds.length-1],
                coveragePct:span?Math.round(ds.length/span*100):null,intraday:prov[k].intraday};
  });
  return {version:1,savedAt:new Date().toISOString(),days,sources,manual:{}};
}

/* A metrics file is recognised by a `days` (or `manual`) map of ISO dates. */
function looksLikeMetrics(raw){
  if(!raw||typeof raw!=="object") return false;
  const probe=o=>o&&typeof o==="object"&&!Array.isArray(o)&&
    Object.keys(o).some(k=>/^\d{4}-\d{2}-\d{2}$/.test(k));
  return probe(raw.days)||probe(raw.manual);
}
async function importMetrics(raw){
  if(!_metricsLoadOk){
    banner("Metrics could not be read this session, so nothing was imported. Please reload.",true);
    return;
  }
  const incoming=normMetrics(raw);
  const dayKeys=Object.keys(incoming.days);
  if(!dayKeys.length&&!Object.keys(incoming.manual).length){
    banner("That metrics file has no recognised metrics in it. Unknown keys are ignored — "+
           "check the names against the registry.",true);
    return;
  }
  // Merge per day, per key. Incoming wins for the keys it carries; every other
  // key on that day is left alone, so importing a partial file is safe.
  let days=0, vals=0, newKeys=0;
  const before=new Set(Object.keys(metrics.sources));
  dayKeys.forEach(d=>{
    const row=incoming.days[d];
    if(!metrics.days[d]) { metrics.days[d]={}; }
    Object.keys(row).forEach(k=>{ metrics.days[d][k]=row[k]; vals++; });
    days++;
  });
  // The `manual` block in an incoming file is additive and never clears yours.
  Object.keys(incoming.manual).forEach(d=>{
    if(!metrics.manual[d]) metrics.manual[d]={};
    Object.keys(incoming.manual[d]).forEach(k=>{ metrics.manual[d][k]=incoming.manual[d][k]; });
  });
  Object.keys(incoming.sources).forEach(k=>{
    metrics.sources[k]=incoming.sources[k];
    if(!before.has(k)) newKeys++;
  });
  const saved=await persistMetrics();
  const known=Object.keys(metrics.sources).length;
  banner(`Imported ${vals} value${vals===1?"":"s"} across ${days} day${days===1?"":"s"}, `+
         `${known} metric${known===1?"":"s"} tracked (${newKeys} new). `+
         `Hand-entered values untouched.`+
         (saved?"":" NOT SAVED to the cloud — kept locally, see the console."),!saved);
  if(viewMode!=="progress") renderProgress(); else renderSafe();
}
function extractWeeksMap(raw){
  const cand = (raw&&raw.state&&raw.state.weeks) ? raw.state.weeks
             : (raw&&raw.weeks)                  ? raw.weeks
             : raw;
  if(!cand||typeof cand!=="object"||Array.isArray(cand)) return null;
  const keys=Object.keys(cand).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k));
  return keys.length?{map:cand,keys}:null;
}
async function importPlan(file){
  const isZip=/\.zip$/i.test(file.name||"")||file.type==="application/zip";

  // A Garmin zip only ever writes the metrics document, so it needs the metrics
  // guard, not the state guard.
  if(isZip){
    if(!_metricsLoadOk){
      banner("Metrics could not be read this session, so nothing was imported. Please reload.",true);
      return;
    }
    banner("Reading the Garmin export\u2026");
    try{
      const zip=await openZip(file);
      const built=await garminZipToMetrics(zip,name=>banner("Reading "+name+"\u2026"));
      const n=Object.keys(built.days).length;
      if(!n){
        banner("No metrics found in that zip. Expected a Garmin Connect export "+
               "containing UDSFile, sleepData, MetricsMaxMetData and similar.",true);
        return;
      }
      await importMetrics(built);
    }catch(e){
      console.error("zip import failed:",e);
      banner("Could not read that zip: "+e.message,true);
    }
    return;
  }

  if(!_loadOk&&!_metricsLoadOk){
    banner("Editing is disabled this session because your data could not be read. "+
           "Nothing was imported. Please reload.",true);
    return;
  }
  let raw;
  try{
    raw=JSON.parse(await file.text());
  }catch(e){
    banner("That file is not valid JSON, so nothing was imported.",true);
    return;
  }
  // One button, several shapes. A metrics file goes to its own document.
  if(looksLikeMetrics(raw)){ await importMetrics(raw); return; }
  if(!_loadOk){
    banner("The plan is read-only this session because your data could not be read. "+
           "Nothing was imported. Please reload.",true);
    return;
  }
  const found=extractWeeksMap(raw);
  if(!found){
    banner("Unrecognised file. Expected a plan (weeks keyed by Monday dates) or "+
           "a metrics file (a `days` map keyed by date).",true);
    return;
  }

  let added=0, updated=0, sessions=0, snapped=0, skipped=0, collided=0;
  const seen=new Set();
  found.keys.forEach(k=>{
    const d=dateFromISO(k);
    if(!d){ skipped++; return; }
    const iso=isoOf(mondayOf(d));
    if(iso!==k) snapped++;                      // a non-Monday key gets snapped, as elsewhere
    // Two keys in the same file can snap to one Monday. normState resolves that
    // with "first one wins"; import must agree, or which plan you get depends on
    // key iteration order.
    if(seen.has(iso)){ collided++; return; }
    seen.add(iso);
    // normWeek coerces every field and drops anything unrecognised, so a
    // malformed file cannot put bad shapes into state.
    const incoming=normWeek(found.map[k],iso);
    const existing=state.weeks[iso];
    if(existing){
      existing.planned=incoming.planned;        // plan only — see the note above
      updated++;
    }else{
      state.weeks[iso]=incoming;
      added++;
    }
    sessions+=incoming.planned.length;
  });

  if(!added&&!updated){ banner("Nothing in that file could be read as a week.",true); return; }

  // A full export contains the plan AND the metrics store. Take both.
  let alsoMetrics=0;
  if(raw&&raw.metrics&&looksLikeMetrics(raw.metrics)&&_metricsLoadOk){
    const inc=normMetrics(raw.metrics);
    Object.keys(inc.days).forEach(d=>{
      if(!metrics.days[d]) metrics.days[d]={};
      Object.keys(inc.days[d]).forEach(k=>{ metrics.days[d][k]=inc.days[d][k]; alsoMetrics++; });
    });
    Object.keys(inc.manual).forEach(d=>{
      if(!metrics.manual[d]) metrics.manual[d]={};
      Object.keys(inc.manual[d]).forEach(k=>{ metrics.manual[d][k]=inc.manual[d][k]; });
    });
    Object.keys(inc.sources).forEach(k=>{ metrics.sources[k]=inc.sources[k]; });
    await persistMetrics();
  }
  const saved=await persist(true);
  const bits=[`Imported ${sessions} session${sessions===1?"":"s"} across `+
              `${added+updated} week${added+updated===1?"":"s"} `+
              `(${added} new, ${updated} updated).`,
              "Comments and habits untouched."];
  if(snapped)  bits.push(`${snapped} key${snapped===1?"":"s"} snapped to its Monday.`);
  if(collided) bits.push(`${collided} duplicate week${collided===1?"":"s"} ignored (first wins).`);
  if(skipped)  bits.push(`${skipped} unreadable date${skipped===1?"":"s"} skipped.`);
  if(alsoMetrics) bits.push(`Also took ${alsoMetrics} metric value${alsoMetrics===1?"":"s"} from the same file.`);
  if(!saved)  bits.push("NOT SAVED to the cloud — kept locally, see the console.");
  banner(bits.join(" "),!saved);

  renderSafe();                                 // never yank the DOM from a caret
}

  signInWithPopup(_auth,new GoogleAuthProvider())
    .catch(e=>{document.getElementById("authError").textContent=e.message;});
});
document.getElementById("signOutBtn").addEventListener("click",()=>signOut(_auth));
document.getElementById("stravaConnectBtn").addEventListener("click",stravaConnect);

/* Body weight — drives the MET fallback for activities Strava gives no calories for. */
function updateWeightBtn(){
  const b=document.getElementById("weightBtn"); if(!b) return;
  b.textContent=((state.settings&&state.settings.weightKg)||75)+" kg";
}
document.getElementById("weightBtn").addEventListener("click",()=>{
  const cur=(state.settings&&state.settings.weightKg)||75;
  const v=prompt("Body weight in kg (used to estimate calories where Strava gives none):",String(cur));
  if(v==null) return;
  const n=Number(String(v).replace(",","."));
  if(!isFinite(n)||n<=25||n>=250){ flash("Enter a weight between 25 and 250 kg",true); return; }
  state.settings.weightKg=Math.round(n*10)/10;
  updateWeightBtn(); schedule(); render();
});

/* Heart-rate thresholds — drive the easy / moderate / hard split. */
function updateHrBtn(){
  const b=document.getElementById("hrBtn"); if(!b) return;
  b.textContent="HR "+hrEasyMax()+"/"+hrHardMin();
}
document.getElementById("hrBtn").addEventListener("click",()=>{
  const e0=hrEasyMax(), h0=hrHardMin();
  const e=prompt("Easy ceiling in bpm — sessions averaging at or below this count as easy:",String(e0));
  if(e==null) return;
  const en=Math.round(Number(String(e).replace(",",".")));
  if(!isFinite(en)||en<80||en>200){ flash("Enter an easy ceiling between 80 and 200 bpm",true); return; }
  const h=prompt("Hard floor in bpm — sessions averaging at or above this count as hard:",String(Math.max(h0,en+1)));
  if(h==null) return;
  const hn=Math.round(Number(String(h).replace(",",".")));
  if(!isFinite(hn)||hn<=en||hn>230){ flash("Hard floor must be above the easy ceiling and at most 230 bpm",true); return; }
  state.settings.hrEasyMax=en;
  state.settings.hrHardMin=hn;
  updateHrBtn(); schedule(); render();
});

/* Manual metric entry. Writes to metrics.manual — a block the Garmin importer
   never touches — keyed on today. Blank clears the value rather than storing 0. */
document.addEventListener("change",async e=>{
  const inp=e.target.closest("input[data-manual]");
  if(!inp) return;
  const key=inp.dataset.manual;
  if(!Object.prototype.hasOwnProperty.call(METRICS,key)) return;
  const today=isoOf(new Date());
  const raw=String(inp.value).trim();
  if(!raw){
    if(metrics.manual[today]){
      delete metrics.manual[today][key];
      if(!Object.keys(metrics.manual[today]).length) delete metrics.manual[today];
    }
    await persistMetrics(); flash("Cleared"); renderProgress(); return;
  }
  const v=Number(raw.replace(",","."));
  if(!isFinite(v)){ flash("Enter a number",true); inp.focus(); return; }
  if(!metrics.manual[today]) metrics.manual[today]={};
  metrics.manual[today][key]=v;
  const ok=await persistMetrics();
  flash(ok?"Saved \u2713":"Save failed — kept locally",!ok);
  renderProgress();
});

window.addEventListener("beforeunload",()=>{
  flushPending();                       // don't lose an edit made inside the debounce window
  if(_cacheDirty) saveCalCache();
});

onAuthStateChanged(_auth,async user=>{
  const gate=document.getElementById("authGate");
  const bar=document.getElementById("userBar");
  if(!user){
    gate.style.display="flex"; bar.style.display="none"; _authed=false;
    return;
  }
  gate.style.display="none"; bar.style.display="flex";
  document.getElementById("userAvatar").src=user.photoURL||"";
  document.getElementById("userEmail").textContent=user.displayName||user.email;
  if(_authed) return;
  _authed=true;

  await loadState();
  await loadCalCache();
  await loadMetrics();

  // Scaffold the remaining months of the year so every month is navigable
  // without a manual "add week" step.
  if(_loadOk && ensureYearScaffold()>0) schedule();

  currentMonth=monthKeyOf(thisMondayISO());
  updateWeightBtn();
  updateHrBtn();
  updateExportBtn();          // export must work without Strava
  renderHome();

  const code=new URLSearchParams(location.search).get("code");
  if(code){
    if(await stravaExchangeCode(code)) await fetchStravaActivities();
    else showConnect(true);
  }else if(await stravaEnsureToken()){
    await fetchStravaActivities();
  }else{
    showConnect(true);
    refreshStatus();
  }
});
</script>
