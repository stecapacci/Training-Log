<!doctype html>
<!-- v36 -->
<!--
  Training Log — Stefano
  ─────────────────────────────────────────────────────────────
  v36. Changes from v35:
   · IMPORT: load a plan file (a bare weeks map or a full export payload) and
     merge it in. Replaces `planned` only — comments and habits are never
     touched, so importing the wrong file cannot cost you your notes.
   · INTENSITY: average heart rate per activity is bucketed into easy /
     moderate / hard and surfaced three ways — a trend card, a distribution
     panel with an 80/20 reference, and a per-activity chip. Thresholds live
     in settings and are editable from the header.
   · Timeline section removed.
   · Schema 35 -> 36. Additive only: settings.hrEasyMax / settings.hrHardMin.
     The Firestore document is deliberately STILL traininglog/state3 — v36
     reads every v35 document unchanged, so there is nothing to migrate and
     no risk of orphaning data behind a new document name.

  v35 structural changes, still in force:
   · NO personal data in this file. Firestore is the sole source of truth.
   · Weeks keyed by ISO Monday date. Quarters removed entirely.
   · Months/years are derived views, never stored.
   · Real Strava calories via cached per-activity detail fetch.
   · Day-aligned week-over-week comparisons.
   · Write-guards: never persists unless a load succeeded.
   · Migrates traininglog/state2 -> traininglog/state3 once, non-destructively.
  ─────────────────────────────────────────────────────────────
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EBEE;--grid:#D2DBE0;--card:#FBFCFD;--ink:#15191F;--ink-soft:#5A6470;
  --line:#D5DCE2;--line-strong:#C0C9D1;
  --swim:#0E96C8;--bike:#E08A22;--run:#E04E37;--strength:#7A5AF0;--brick:#B4451F;--race:#BE9A1F;--rest:#7A8794;
  --good:#1F9D6B;--warn:#C9821A;--bad:#D0432B;
  --radius:14px;--shadow:0 1px 0 rgba(21,25,31,.04),0 8px 24px -16px rgba(21,25,31,.28);
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1020px;margin:0 auto;padding:28px 18px 90px}
.hdr{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:var(--ink-soft)}
.nav-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:2px}
.this-wk-btn,.mon-btn{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(21px,3.6vw,32px);letter-spacing:-.02em;background:none;border:none;cursor:pointer;color:var(--ink);padding:0;line-height:1.1;white-space:nowrap}
.this-wk-btn:hover,.mon-btn:hover{color:var(--swim)}
.this-wk-btn.active,.mon-btn.active{color:var(--swim)}
.mon-wrap{position:relative;display:inline-block}
.mon-btn{display:flex;align-items:center;gap:8px}
.mon-btn svg{flex:none;transition:transform .15s}
.mon-btn.open svg{transform:rotate(180deg)}
.mon-menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 32px -8px rgba(21,25,31,.22);min-width:230px;max-height:340px;overflow-y:auto;z-index:50;display:none}
.mon-menu.show{display:block}
.mon-yr{font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-soft);padding:9px 16px 5px;background:#F1F4F6;position:sticky;top:0}
.mon-opt{font-family:"JetBrains Mono",monospace;font-size:13px;padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.mon-opt:last-child{border-bottom:none}
.mon-opt:hover{background:#F1F4F6}
.mon-opt.active{font-weight:700}
.mon-opt.active::after{content:"✓";margin-left:auto;color:var(--good)}
.mon-opt small{margin-left:auto;color:var(--ink-soft);font-size:11px}
.mon-opt.active small{margin-left:0}
.user-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.user-bar img{width:26px;height:26px;border-radius:50%;border:1px solid var(--line)}
.user-bar span{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-soft)}
.signout-btn,.strava-btn{font-family:"JetBrains Mono",monospace;font-size:11px;border-radius:8px;padding:5px 10px;cursor:pointer}
.signout-btn{border:1px solid var(--line-strong);background:none;color:var(--ink-soft)}
.signout-btn:hover{border-color:var(--ink);color:var(--ink)}
.strava-btn{border:none;background:#FC4C02;color:#fff;display:flex;align-items:center;gap:6px}
.strava-btn:hover{background:#e04400}
.sync-status{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft);margin-bottom:4px;min-height:14px;text-align:right}
.sync-status.err{color:var(--run)}
.sync-status.warn{color:var(--warn)}
.export-btn{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:0;text-align:right;display:none}
.export-btn:hover{color:var(--ink);text-decoration:underline}

/* ── section headings ── */
.sec-head{font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--ink-soft);margin:22px 0 9px}
.sec-head:first-child{margin-top:0}

/* ── trend cards ── */
.trends{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.trend-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.trend-card .tc-label{font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:5px}
.trend-card .tc-val{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:30px;line-height:1;letter-spacing:-.02em}
.trend-card .tc-sub{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-soft);margin-top:5px;line-height:1.45}
.trend-card .tc-sub b{font-weight:700;color:var(--ink-soft)}
.trend-card.up .tc-val{color:var(--good)}
.trend-card.down .tc-val{color:var(--run)}
.trend-card.neutral .tc-val{color:var(--ink)}
.tc-est{display:inline-block;font-size:9px;padding:1px 5px;border-radius:999px;background:#EEF1F4;color:var(--ink-soft);margin-left:5px;vertical-align:middle;letter-spacing:.06em}

/* ── panels ── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;overflow-x:auto}
.panel h3{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:15px;margin:0 0 12px}
.panel .muted{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-soft)}
.two-panel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two-panel{grid-template-columns:1fr}}

/* ── tables ── */
.dtable{width:100%;border-collapse:collapse;font-family:"JetBrains Mono",monospace;font-size:12px}
.dtable th{text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);padding:4px 9px;border-bottom:1px solid var(--line);font-weight:500}
.dtable th:first-child{text-align:left}
.dtable td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--line)}
.dtable td:first-child{text-align:left;color:var(--ink-soft);font-size:11px}
.dtable tr:last-child td{border-bottom:none}
.dtable tr.this-wk td{font-weight:700;color:var(--ink)}
.dtable tr.total-row td{font-weight:700;color:var(--ink);border-top:2px solid var(--line-strong)}

/* ── adherence ── */
.adh-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.adh-name{font-family:"JetBrains Mono",monospace;font-size:11.5px;min-width:60px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
.adh-bar{flex:1;height:9px;border-radius:999px;background:#EDF0F3;overflow:hidden;min-width:60px}
.adh-fill{height:100%;border-radius:999px;transition:width .3s}
.adh-num{font-family:"JetBrains Mono",monospace;font-size:12px;min-width:48px;text-align:right}
.adh-big{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.02em;line-height:1}
.adh-caption{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft);margin-top:3px}

/* ── debrief ── */
.debrief-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin-bottom:12px}
.mini{background:#F7F9FA;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.mini .m-l{font-family:"JetBrains Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft)}
.mini .m-v{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:19px;margin-top:3px;line-height:1}
.missed{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-soft);line-height:1.7}
.missed .mx{color:var(--run)}

/* ── intensity distribution (v36) ── */
.int-bar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:#EDF0F3;margin:4px 0 10px}
.int-seg{display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;color:#fff;min-width:0;transition:width .3s;white-space:nowrap}
.int-easy{background:var(--good)}
.int-mod{background:var(--warn)}
.int-hard{background:var(--bad)}
.int-legend{display:flex;flex-wrap:wrap;gap:14px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft)}
.int-legend span.k{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:baseline}
.int-note{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-soft);line-height:1.6;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.int-target{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft);margin-top:2px}
.zchip{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:999px;margin-left:5px;vertical-align:middle;color:#fff}
.zchip.z-easy{background:var(--good)}
.zchip.z-mod{background:var(--warn)}
.zchip.z-hard{background:var(--bad)}

/* ── week cards ── */
.weeks{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.week{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--swim);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.wk-head{display:flex;align-items:center;gap:12px;padding:14px 16px}
.wk-date{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;letter-spacing:.02em;min-width:74px}
.wk-sub{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-soft);letter-spacing:.06em}
.wk-meta{margin-left:auto;display:flex;align-items:center;gap:12px}
.wk-progress{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-soft)}
.wk-body{padding:2px 16px 18px}
.wk-col-head{font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-soft);margin:0 0 7px}
.col-label{font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-soft);margin:14px 0 7px}
.wk-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
@media(max-width:760px){.wk-cols{grid-template-columns:1fr}}
.comments-wrap{margin-top:14px}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font:inherit;color:var(--ink);resize:none;min-height:62px;line-height:1.45}
textarea:focus{outline:none;border-color:var(--ink)}
textarea::placeholder{color:#A4AEB7}
.plan{display:flex;flex-direction:column;gap:3px}
.pitem{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:9px;transition:background .12s}
.pitem:hover{background:#F1F4F6}
.pitem.done .ptext{text-decoration:line-through;color:var(--ink-soft)}
.check{appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1.5px solid var(--line-strong);border-radius:6px;flex:none;cursor:pointer;position:relative;background:#fff;transition:.12s}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chip{font-family:"JetBrains Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#fff;border:none;border-radius:6px;padding:3px 6px;min-width:46px;text-align:center;cursor:pointer;flex:none}
.chip:hover{filter:brightness(1.1)}
.ptext{flex:1;border:none;background:none;font:inherit;color:var(--ink);padding:3px 2px;border-bottom:1px solid transparent;min-width:0}
.ptext:focus{outline:none;border-bottom-color:var(--line-strong)}
.del{border:none;background:none;color:var(--ink-soft);cursor:pointer;opacity:0;font-size:16px;line-height:1;padding:2px 4px;flex:none}
.pitem:hover .del{opacity:.6}.del:hover{opacity:1;color:var(--run)}
.add-sess{margin-top:6px;border:1px dashed var(--line-strong);background:none;color:var(--ink-soft);font-family:"JetBrains Mono",monospace;font-size:11px;border-radius:8px;padding:6px 10px;cursor:pointer}
.add-sess:hover{border-color:var(--ink);color:var(--ink)}
.strava-activities{display:flex;flex-direction:column;gap:6px}
.act-card{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:10px;background:#F7F9FA;border:1px solid var(--line)}
.act-disc{width:6px;min-height:36px;border-radius:3px;flex:none;margin-top:2px}
.act-body{flex:1;min-width:0}
.act-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.act-stat{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft)}
.act-stat b{color:var(--ink);font-weight:600}
.act-stat.est b{color:var(--ink-soft);font-weight:500}
.act-date{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-soft);margin-left:auto;white-space:nowrap;padding-top:2px}
.strava-loading{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-soft);padding:8px 0}
.habits-wrap{margin-top:16px}
.habits-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:"JetBrains Mono",monospace;font-size:13px}
.habits-table th{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-soft);padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);background:#F7F9FA;font-weight:500}
.habits-table th:not(:first-child){text-align:center}
.habits-table td{padding:5px 8px;border-bottom:1px solid var(--line)}
.habits-table tr:last-child td{border-bottom:none}
.habits-table td:first-child{color:var(--ink-soft);font-size:11px;width:44px;padding-left:12px}
.habits-table td:not(:first-child){text-align:center}
.habits-table tfoot td{font-weight:700;background:#F7F9FA;border-top:2px solid var(--line-strong)}
.habit-inp{width:100%;border:none;background:none;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink);text-align:center;padding:4px 2px;border-bottom:1px solid transparent}
.habit-inp:focus{outline:none;border-bottom-color:var(--line-strong)}
.habit-inp::placeholder{color:#C8D0D8}
.save-flash{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-family:"JetBrains Mono",monospace;font-size:12px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.save-flash.show{opacity:1;transform:translateX(-50%) translateY(0)}
.save-flash.bad{background:var(--bad)}
.banner{background:#FFF6E6;border:1px solid #E7D2A0;color:#7A5A18;border-radius:10px;padding:10px 13px;font-family:"JetBrains Mono",monospace;font-size:11.5px;margin-bottom:12px;display:none;line-height:1.6}
.banner.show{display:block}
.banner.bad{background:#FDECE9;border-color:#EFBFB6;color:#8A2E1C}
.auth-gate{position:fixed;inset:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;display:flex;align-items:center;justify-content:center;z-index:100}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px 36px;max-width:360px;width:90%;text-align:center}
.auth-card h2{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
.auth-card p{color:var(--ink-soft);font-size:14px;margin:0 0 28px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 20px;border:1px solid var(--line-strong);border-radius:10px;background:#fff;cursor:pointer;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:15px;color:var(--ink);transition:box-shadow .15s}
.google-btn:hover{box-shadow:0 2px 12px rgba(21,25,31,.12)}
.auth-error{margin-top:14px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--run);min-height:18px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>

<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <h2>Training Log</h2>
    <p>Sign in to continue</p>
    <button class="google-btn" id="signInBtn">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<div class="wrap">
  <div class="hdr">
    <div>
      <div class="eyebrow">Training Log</div>
      <div class="nav-row">
        <button class="this-wk-btn" id="homeBtn">This week</button>
        <div class="mon-wrap">
          <button class="mon-btn" id="monBtn">
            <span id="monLabel">Month</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="mon-menu" id="monMenu"></div>
        </div>
      </div>
    </div>
    <div style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div class="user-bar" id="userBar" style="display:none">
        <img id="userAvatar" src="" alt="">
        <span id="userEmail"></span>
        <button class="strava-btn" id="stravaConnectBtn" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L8.38 0 1 13.828h4.172"/></svg>
          Connect Strava
        </button>
        <button class="signout-btn" id="weightBtn" title="Body weight used for estimated calories">75 kg</button>
        <button class="signout-btn" id="hrBtn" title="Heart-rate thresholds for the easy / moderate / hard split">HR 140/161</button>
        <button class="signout-btn" id="signOutBtn">Sign out</button>
      </div>
      <div class="sync-status" id="syncStatus">Connecting…</div>

/* ════════════════════════════════════════════════════════════
   SCHEMA NORMALISATION  (null-safety — fixes v34 H6)
   ════════════════════════════════════════════════════════════ */
const ZERO_WORDS=new Set(["none","nada","no","nope","zero","niente","-","—","nothing","tempted but no"]);

/** Free-text habit value -> integer or null. null = not recorded, 0 = recorded zero. */
function parseHabit(v){
  if(v===null||v===undefined) return null;
  if(typeof v==="number") return isFinite(v)?Math.round(v):null;
  const s=String(v).trim();
  if(s==="") return null;
  const low=s.toLowerCase();
  if(ZERO_WORDS.has(low)) return 0;
  const m=/-?\d+/.exec(s);                       // "9 units"->9, "Beers 3"->3
  if(m) return parseInt(m[0],10);
  if(/^[xX]+$/.test(s)) return s.length;         // tally marks
  if(/^(tempted|not |didn|nope)/.test(low)) return 0;
  return null;
}
function emptyHabits(){
  const h={}; DAYS.forEach(d=>{h[d]={cigs:null,drinks:null};}); return h;
}
function normHabits(raw){
  const h=emptyHabits();
  if(!raw||typeof raw!=="object") return h;
  DAYS.forEach(d=>{
    const src=raw[d]||raw[d.toLowerCase()]||{};
    h[d]={cigs:parseHabit(src.cigs),drinks:parseHabit(src.drinks)};
  });
  return h;
}
function normPlanned(raw){
  if(!Array.isArray(raw)) return [];
  return raw.filter(p=>p&&typeof p==="object").map(p=>({
    id: typeof p.id==="string"&&p.id ? p.id : uid(),
    disc: Object.prototype.hasOwnProperty.call(DISC,p.disc) ? p.disc : "rest",
    text: typeof p.text==="string" ? p.text : (typeof p.label==="string"?p.label:""),
    done: !!p.done
  }));
}
/** Guarantees every field exists and is the right type. */
function normWeek(raw,isoKey){
  const r=(raw&&typeof raw==="object")?raw:{};
  // The map key is authoritative. If a stored `date` disagreed with its key, the
  // card's dataset.week would not resolve and every edit to it would be silently
  // discarded, while the card still rendered normally.
  const iso=/^\d{4}-\d{2}-\d{2}$/.test(isoKey||"")
    ? isoKey
    : (/^\d{4}-\d{2}-\d{2}$/.test(r.date||"") ? r.date : isoKey);
  // No `phase`, no `focus`. Weeks are never labelled or classified, and the app
  // never writes prose describing your training. Legacy values on stored weeks
  // are dropped here and never resurface.
  return {
    date: iso,
    comments: typeof r.comments==="string" ? r.comments : "",
    isRace: !!r.isRace,
    planned: normPlanned(r.planned),
    habits: normHabits(r.habits)
  };
}
function normState(raw){
  const s=blankState();
  if(!raw||typeof raw!=="object") return s;
  if(raw.settings&&typeof raw.settings==="object"){
    const w=Number(raw.settings.weightKg);
    s.settings.weightKg = (isFinite(w)&&w>25&&w<250) ? w : 75;
    // v36: absent on every v35 document, so fall back rather than reject.
    const e=Number(raw.settings.hrEasyMax);
    s.settings.hrEasyMax = (isFinite(e)&&e>=80&&e<=200) ? Math.round(e) : HR_EASY_MAX_DEFAULT;
    const h=Number(raw.settings.hrHardMin);
    s.settings.hrHardMin = (isFinite(h)&&h>s.settings.hrEasyMax&&h<=230)
      ? Math.round(h)
      : Math.max(s.settings.hrEasyMax+1,HR_HARD_MIN_DEFAULT);
  }
  s.savedAt = typeof raw.savedAt==="string" ? raw.savedAt : null;
  const src=(raw.weeks&&typeof raw.weeks==="object")?raw.weeks:{};
  Object.keys(src).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const d=dateFromISO(k); if(!d) return;
    // Self-heal a non-Monday key by snapping it to its Monday. Weeks are
    // Monday-keyed by definition; a stray key would mis-bucket every activity.
    const key=isoOf(mondayOf(d));
    if(s.weeks[key]) return;                      // first one wins
    s.weeks[key]=normWeek(src[k],key);
  });
  return s;
}
function getWeek(iso){return state.weeks[iso]||null;}
function sortedWeekKeys(){return Object.keys(state.weeks).sort();}

/* ════════════════════════════════════════════════════════════
   MIGRATION  v34 (quarter-keyed arrays) -> v35 (ISO week map)
   Runs once. Reads state2, writes state3. Never writes state2.
   ════════════════════════════════════════════════════════════ */
const MON_ABBR={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

function migrateLegacy(legacyState){
  const weeks={};
  const report={source:0,migrated:0,skipped:[],collisions:[]};
  if(!legacyState||typeof legacyState!=="object") return {weeks,report};

  Object.keys(legacyState).forEach(qid=>{
    const arr=legacyState[qid];
    if(!Array.isArray(arr)) return;
    const ym=/(\d{4})$/.exec(qid);
    const year=ym?+ym[1]:new Date().getFullYear();
    arr.forEach(w=>{
      report.source++;
      const dm=/^(\d{1,2})-([A-Za-z]{3})$/.exec(String((w&&w.date)||"").trim());
      if(!dm){ report.skipped.push(qid+":"+((w&&w.date)||"?")); return; }
      const mon=MON_ABBR[dm[2][0].toUpperCase()+dm[2].slice(1,3).toLowerCase()];
      if(mon===undefined){ report.skipped.push(qid+":"+w.date); return; }
      const d=new Date(year,mon,parseInt(dm[1],10)); d.setHours(0,0,0,0);
      const key=isoOf(mondayOf(d));               // snap to Monday defensively
      if(weeks[key]){ report.collisions.push(key); return; }
      weeks[key]=normWeek(w,key);
      report.migrated++;
    });
  });
  return {weeks,report};
}

/* ════════════════════════════════════════════════════════════
   PERSISTENCE  (write-guarded — fixes v34 C2/C3)
   ════════════════════════════════════════════════════════════ */
function syncStatus(msg,cls){
  const e=document.getElementById("syncStatus"); if(!e) return;
  e.textContent=msg; e.className="sync-status"+(cls?" "+cls:"");
}
function banner(msg,bad){
  const b=document.getElementById("banner"); if(!b) return;
  if(!msg){ b.className="banner"; b.textContent=""; return; }
  b.textContent=msg; b.className="banner show"+(bad?" bad":"");
}
function flash(msg,bad){
  const f=document.getElementById("flash"); if(!f) return;
  f.textContent=msg||"Saved ✓";
  f.className="save-flash show"+(bad?" bad":"");
  clearTimeout(f._t); f._t=setTimeout(()=>{f.className="save-flash"+(bad?" bad":"");},1400);
}
function pushLocalBackup(){
  try{
    const arr=JSON.parse(localStorage.getItem(LS_BACKUP)||"[]");
    arr.push({at:new Date().toISOString(),payload:state});
    while(arr.length>5) arr.shift();
    localStorage.setItem(LS_BACKUP,JSON.stringify(arr));
  }catch(e){/* quota — non-fatal */}
}
/** Last-resort local read: the current mirror, else the newest rolling backup. */
function readLocalFallback(){
  try{
    const raw=localStorage.getItem(LS_STATE);
    if(raw) return {payload:JSON.parse(raw),from:"your last local copy"};
  }catch(_){}
  try{
    const arr=JSON.parse(localStorage.getItem(LS_BACKUP)||"[]");
    if(Array.isArray(arr)&&arr.length){
      const last=arr[arr.length-1];
      if(last&&last.payload){
        return {payload:last.payload,from:"a local backup from "+String(last.at||"").slice(0,10)};
      }
    }
  }catch(_){}
  return null;
}

async function loadState(){
  syncStatus("Loading…");
  try{
    const snap=await getDoc(DOC_STATE);
    if(snap.exists()&&snap.data()&&snap.data().payload){
      state=normState(snap.data().payload);
      _loadOk=true;
      syncStatus("Synced ✓");
      return;
    }
    // No v35 doc yet — attempt the one-time migration from v34.
    syncStatus("Migrating from v34…");
    let legacy=null, legacyReadOk=false;
    try{
      const ls=await getDoc(DOC_LEGACY);
      legacyReadOk=true;
      if(ls.exists()&&ls.data()) legacy=ls.data().payload||null;
    }catch(e){ console.error("legacy read failed",e); }

    if(!legacyReadOk){
      // We do not know whether v34 data exists. Treating this as a fresh install
      // would write an empty state3 and orphan the entire history in state2,
      // permanently — after that first write, migration could never run again.
      _loadOk=false;
      state=blankState();
      banner("Could not read your existing data in order to migrate it. Editing is disabled so "+
             "nothing can overwrite it. Your data is safe where it is — please reload.",true);
      syncStatus("Migration blocked — reload",'err');
      return;
    }

    if(legacy){
      const {weeks,report}=migrateLegacy(legacy);
      state=blankState();
      state.weeks=weeks;
      _loadOk=true;
      await persist(true);
      banner(`Migrated ${report.migrated} weeks from v34 to the new month-based format. `+
             `Your old data is untouched at traininglog/state2. `+
             (report.skipped.length?`Skipped (unreadable date): ${report.skipped.join(", ")}. `:"")+
             (report.collisions.length?`Skipped (duplicate week): ${report.collisions.join(", ")}.`:""));
      syncStatus("Migrated ✓");
      return;
    }
    // Genuinely fresh install.
    state=blankState(); _loadOk=true;
    syncStatus("Ready ✓");
  }catch(e){
    // READ FAILED. Do not write anything, ever, this session.
    console.error("Load failed:",e);
    _loadOk=false;
    const local=readLocalFallback();
    if(local){
      try{ state=normState(local.payload); }catch(_){ state=blankState(); }
      banner("Could not reach the database. Showing "+local.from+" — editing is disabled "+
             "so nothing overwrites the cloud data. Reload when back online.",true);
      syncStatus("Offline — read only",'err');
    }else{
      state=blankState();
      banner("Could not reach the database and no local copy exists. Editing is disabled. Please reload.",true);
      syncStatus("Offline — no data",'err');
    }
  }
}

async function persist(silent){
  if(!_loadOk){                                  // ← the guard that fixes C2
    if(!silent) flash("Read-only — not saved",true);
    return false;
  }
  state.version=SCHEMA_VERSION;
  state.savedAt=new Date().toISOString();
  try{
    await setDoc(DOC_STATE,{payload:state},{merge:false});
    try{ localStorage.setItem(LS_STATE,JSON.stringify(state)); }catch(_){}
    pushLocalBackup();
    refreshStatus();
    if(!silent) flash();
    return true;
  }catch(e){
    console.error("Save failed:",e);
    try{ localStorage.setItem(LS_STATE,JSON.stringify(state)); }catch(_){}
    syncStatus("Save failed — kept locally",'err');
    if(!silent) flash("Save failed — kept locally",true);
    return false;
  }
}
function schedule(){
  if(!_loadOk){
    // Tell the user once, rather than letting them type into the void.
    if(!_roWarned){ _roWarned=true; flash("Read-only — changes are not being saved",true); }
    return;
  }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>persist(true),700);
}
/** Synchronous best-effort flush for tab close — the debounce would lose it. */
function flushPending(){
  if(!_loadOk||!saveTimer) return;
  clearTimeout(saveTimer); saveTimer=null;
  try{ localStorage.setItem(LS_STATE,JSON.stringify(state)); }catch(_){}
  persist(true);
}
function statusLine(){
  if(!_loadOk) return "Offline — read only";          // never claim "Synced" when writes are blocked
  const n=allActivities.length;
  const pending=n-allActivities.filter(a=>Object.prototype.hasOwnProperty.call(calCache,a.id)).length;
  if(_rateLimited){
    return `Strava limit reached · ${n} activities · ${pending} cals pending · resumes in ${rlMinutesToReset()} min`;
  }
  if(!n) return stravaToken?"Synced ✓ · no activities":"Synced ✓ · Strava not connected";
  let s=`Synced ✓ · ${n} activities`;
  if(pending>0) s+=` · ${pending} cals pending`;
  return s;
}
function statusClass(){ return !_loadOk?'err':(_rateLimited?'warn':null); }
function refreshStatus(){ syncStatus(statusLine(),statusClass()); }

/* ── activity calorie cache ── */
async function loadCalCache(){
  try{
    const s=await getDoc(DOC_ACTCACHE);
    if(s.exists()&&s.data()&&s.data().cal&&typeof s.data().cal==="object") calCache=s.data().cal;
  }catch(e){ console.warn("cal cache read failed",e); }
}
async function saveCalCache(){
  if(!_cacheDirty||!_loadOk) return;
  try{
    await setDoc(DOC_ACTCACHE,{cal:calCache,updatedAt:new Date().toISOString()},{merge:false});
    _cacheDirty=false;
  }catch(e){ console.warn("cal cache write failed",e); }
}

/* ════════════════════════════════════════════════════════════
   STRAVA
   ════════════════════════════════════════════════════════════ */
/* ── rate-limit budget, shared across page loads via localStorage ── */
function rlWindowId(t){return Math.floor((t||Date.now())/(15*60*1000));}  // natural 15-min blocks
function rlDayId(t){return Math.floor((t||Date.now())/86400000);}         // UTC day
function rlRead(){
  // Everything is coerced to a finite number. A corrupt or hand-edited value
  // would otherwise turn the budget into NaN, and since `NaN <= 0` is false
  // every guard would silently pass — disabling rate limiting entirely.
  const count=v=>{const n=Number(v);return Number.isFinite(n)&&n>=0?Math.floor(n):0;};
  const id=v=>{const n=Number(v);return Number.isFinite(n)?n:null;};
  try{
    const r=JSON.parse(localStorage.getItem(RL_KEY)||"{}")||{};
    return {win:id(r.win),winN:count(r.winN),day:id(r.day),dayN:count(r.dayN)};
  }catch(_){ return {win:null,winN:0,day:null,dayN:0}; }
}
function rlSpend(n){
  const w=rlWindowId(), d=rlDayId(), r=rlRead();
  const rec={win:w,winN:(r.win===w?r.winN:0)+n,day:d,dayN:(r.day===d?r.dayN:0)+n};
  try{ localStorage.setItem(RL_KEY,JSON.stringify(rec)); }catch(_){}
}
function rlRemaining(){
  const w=rlWindowId(), d=rlDayId(), r=rlRead();
  const winUsed=(r.win===w)?r.winN:0;
  const dayUsed=(r.day===d)?r.dayN:0;
  return {
    window:Math.max(0,RL_WINDOW_CAP-winUsed-RL_SAFETY),
    day:Math.max(0,RL_DAY_CAP-dayUsed-RL_SAFETY)
  };
}
function rlMinutesToReset(){
  const now=Date.now();
  return Math.max(1,Math.ceil(((rlWindowId(now)+1)*(15*60*1000)-now)/60000));
}
/**
 * Every Strava *API* call goes through here so nothing escapes the budget.
 * The two OAuth token endpoints deliberately bypass it — RL_SAFETY reserves
 * headroom for them so a token refresh can never be blocked by the budget.
 * Guards are written `!(x>0)` so a NaN budget fails closed, not open.
 */
async function stravaFetch(url,headers){
  const rem=rlRemaining();
  if(!(rem.window>0)){ markRateLimited(); return {rlBlocked:true,reason:"window"}; }
  if(!(rem.day>0)){ markRateLimited(); return {rlBlocked:true,reason:"day"}; }
  rlSpend(1);
  return fetch(url,{headers});
}
/** Flag the limit and schedule an automatic resume at the next window boundary. */
function markRateLimited(){
  if(_rateLimited) return;
  _rateLimited=true;
  const wait=rlMinutesToReset()*60000+5000;
  clearTimeout(_rlTimer);
  _rlTimer=setTimeout(()=>{
    _rateLimited=false;
    refreshStatus();
    if(stravaToken) backfillCalories();     // pick up where we left off
  },wait);
}

function stravaConnect(){
  location.href="https://www.strava.com/oauth/authorize"+
    `?client_id=${STRAVA_CLIENT_ID}&redirect_uri=${encodeURIComponent(STRAVA_REDIRECT)}`+
    "&response_type=code&approval_prompt=auto&scope=activity:read_all";
}
async function stravaSecret(){
  const s=await getDoc(DOC_STRAVA);
  if(!s.exists()) throw new Error("Strava secret missing");
  return s.data().clientSecret;
}
function storeToken(d){
  if(!d||!d.access_token) return false;
  stravaToken=d.access_token;
  localStorage.setItem("strava_token",d.access_token);
  localStorage.setItem("strava_token_exp",String(d.expires_at||0));
  if(d.refresh_token) localStorage.setItem("strava_refresh_token",d.refresh_token);
  return true;
}
async function stravaExchangeCode(code){
  try{
    const cs=await stravaSecret();
    const r=await fetch("https://www.strava.com/oauth/token",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({client_id:STRAVA_CLIENT_ID,client_secret:cs,code,grant_type:"authorization_code"})
    });
    const d=await r.json();
    if(storeToken(d)){
      history.replaceState({},"",location.pathname);
      return true;
    }
  }catch(e){ console.error("Strava exchange failed",e); }
  return false;
}
async function stravaEnsureToken(){
  const exp=parseInt(localStorage.getItem("strava_token_exp")||"0",10);
  if(Date.now()/1000 < exp-300){
    stravaToken=localStorage.getItem("strava_token")||null;
    if(stravaToken) return true;
  }
  const rt=localStorage.getItem("strava_refresh_token");
  if(!rt) return false;
  try{
    const cs=await stravaSecret();
    const r=await fetch("https://www.strava.com/oauth/token",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({client_id:STRAVA_CLIENT_ID,client_secret:cs,refresh_token:rt,grant_type:"refresh_token"})
    });
    return storeToken(await r.json());
  }catch(e){ console.error("Strava refresh failed",e); return false; }
}
function showConnect(show){
  const b=document.getElementById("stravaConnectBtn");
  if(b) b.style.display=show?"flex":"none";
}

/** Paginate until the API returns a short page — no fixed cap (fixes v34 M8). */
async function fetchStravaActivities(){
  if(!stravaToken) return;
  const headers={Authorization:`Bearer ${stravaToken}`};
  const out=[];
  try{
    for(let page=1;;page++){
      syncStatus(`Loading activities… (${out.length})`);
      const r=await stravaFetch(`https://www.strava.com/api/v3/athlete/activities?per_page=100&page=${page}`,headers);
      if(r.rlBlocked) break;                    // budget exhausted — keep what we have
      if(r.status===401){
        stravaToken=null;
        localStorage.removeItem("strava_token");
        localStorage.removeItem("strava_token_exp");
        showConnect(true);
        syncStatus("Strava session expired — reconnect",'err');
        return;
      }
      if(r.status===429){
        markRateLimited();
        break;                                  // keep whatever we already have
      }
      if(!r.ok) throw new Error("Strava HTTP "+r.status);
      const batch=await r.json();
      if(!Array.isArray(batch)||batch.length===0) break;
      out.push(...batch.filter(a=>a&&a.id));
      if(batch.length<100) break;               // short page = last page
    }
    allActivities=out;
    showConnect(false);
    updateExportBtn();
    refreshStatus();
    renderSafe();
    if(!_rateLimited) backfillCalories();       // pointless to try while limited
  }catch(e){
    console.error("Strava fetch failed",e);
    syncStatus("Strava unavailable — showing plan only",'err');
  }
}

/** Progressive per-activity detail fetch to get Strava's own calorie figure. */
async function backfillCalories(){
  if(_backfillRunning||!stravaToken||_rateLimited) return;
  const todo=allActivities
    .filter(a=>!Object.prototype.hasOwnProperty.call(calCache,a.id))
    .map(a=>a.id);
  if(!todo.length){ refreshStatus(); return; }

  // Live budget: whatever the 15-minute window and the daily cap still allow,
  // counting requests already spent by earlier page loads in this same window.
  const rem=rlRemaining();
  const budget=Math.max(0,Math.min(BACKFILL_PER_LOAD,rem.window,rem.day));
  if(budget===0){ refreshStatus(); return; }

  _backfillRunning=true;
  const queue=todo.slice(0,budget);
  const target=queue.length;
  const headers={Authorization:`Bearer ${stravaToken}`};
  let done=0, stop=false;

  async function worker(){
    // shift() is atomic relative to the awaits below — no id can be lost or doubled
    while(queue.length&&!stop){
      const id=queue.shift();
      try{
        const r=await stravaFetch(`https://www.strava.com/api/v3/activities/${id}?include_all_efforts=false`,headers);
        if(r.rlBlocked){ stop=true; break; }
        if(r.status===429){ markRateLimited(); stop=true; break; }
        if(r.status===401){ stop=true; break; }
        if(r.status===404){ calCache[id]=0; _cacheDirty=true; }   // gone for good — cache the miss
        else if(!r.ok){ /* transient: leave uncached so we retry next load */ }
        else{
          const d=await r.json();
          calCache[id]=(typeof d.calories==="number"&&d.calories>0)?Math.round(d.calories):0;
          _cacheDirty=true;
        }
      }catch(e){ stop=true; break; }
      done++;
      if(done%10===0) syncStatus(`Fetching calories… ${done}/${target}`);
    }
  }
  await Promise.all(Array.from({length:BACKFILL_CONCURRENCY},worker));
  await saveCalCache();
  _backfillRunning=false;
  refreshStatus();
  renderSafe();
}

/* ════════════════════════════════════════════════════════════
   CALORIES  (fixes v34 H1)
     1. Strava's own figure (cached)         — authoritative
     2. kilojoules x 1.0 for power rides     — work ≈ kcal at ~23% efficiency
     3. MET x weight x hours                 — everything else
   ════════════════════════════════════════════════════════════ */
function activityCalories(a){
  const cached=Object.prototype.hasOwnProperty.call(calCache,a.id)?calCache[a.id]:null;
  if(typeof cached==="number"&&cached>0) return {kcal:cached,est:false};

  const st=sportOf(a);
  const hrs=durationSecs(a)/3600;
  if(hrs<=0) return {kcal:0,est:true};

  if(typeof a.kilojoules==="number"&&a.kilojoules>0&&BIKE_TYPES.has(st)){
    return {kcal:Math.round(a.kilojoules),est:true};   // work in kJ ≈ kcal burned at ~23% efficiency
  }
  const meta=metaFor(st);
  const met=meta?meta.met:DEFAULT_MET;
  const w=(state.settings&&state.settings.weightKg)||75;
  return {kcal:Math.round(met*w*hrs),est:true};
}

/* ════════════════════════════════════════════════════════════
   STATS ENGINE  — one implementation, used everywhere (fixes v34 duplication)
   ════════════════════════════════════════════════════════════ */
function actsBetween(start,end){
  return allActivities.filter(a=>{const d=actDate(a);return d>=start&&d<end;});
}
/**
 * Aggregate a set of activities. The single source of truth for every number
 * shown anywhere in the app.
 */
/**
 * Split parts into whole percentages that total exactly 100, giving the leftover
 * units to the largest fractional remainders. Never returns a negative.
 */
function sharesTo100(parts,total){
  if(!(total>0)) return parts.map(()=>0);
  const raw=parts.map(p=>(p/total)*100);
  const floor=raw.map(Math.floor);
  let left=100-floor.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>({i,frac:v-Math.floor(v)}))
                 .sort((a,b)=>b.frac-a.frac);
  const out=floor.slice();
  for(let k=0;k<order.length&&left>0;k++,left--) out[order[k].i]++;
  return out;
}
function computeTotals(acts){
  const t={
    count:acts.length, secs:0, kcal:0, kcalEstimated:0,
    bikeM:0, runM:0, swimM:0,
    runSec:0, swimSec:0,
    bikeWattSum:0, bikeWattN:0, hrWSum:0, hrN:0,
    // v36 intensity: seconds bucketed by the session's average HR
    easySec:0, modSec:0, hardSec:0
  };
  const eMax=hrEasyMax(), hMin=hrHardMin();
  acts.forEach(a=>{
    const st=sportOf(a);
    const secs=durationSecs(a);
    const dist=a.distance||0;
    t.secs+=secs;

    const c=activityCalories(a);
    t.kcal+=c.kcal;
    if(c.est) t.kcalEstimated+=c.kcal;

    if(BIKE_TYPES.has(st)){
      t.bikeM+=dist;
      if(a.average_watts>0&&st!=="EBikeRide"){ t.bikeWattSum+=a.average_watts; t.bikeWattN++; }
    }
    if(RUN_TYPES.has(st)){ t.runM+=dist; t.runSec+=secs; }
    if(SWIM_TYPES.has(st)&&dist>0){ t.swimM+=dist; t.swimSec+=secs; }
    if(a.average_heartrate>0){
      const hr=a.average_heartrate;
      t.hrWSum+=hr*secs; t.hrN++;
      if(hr<=eMax)      t.easySec+=secs;
      else if(hr>=hMin) t.hardSec+=secs;
      else              t.modSec+=secs;
    }
  });
  t.hrs=t.secs/3600;
  t.bikeKm=t.bikeM/1000;
  t.runKm=t.runM/1000;
  t.runPace=t.runM>0?fmtPace(t.runM,t.runSec):"—";
  t.swimPace=t.swimM>0?fmtPaceSwim(t.swimM,t.swimSec):"—";
  t.avgPower=t.bikeWattN>0?Math.round(t.bikeWattSum/t.bikeWattN):0;
  // Weighted by duration, not a mean of means — see hrWSum above.
  t.hrSecs=t.easySec+t.modSec+t.hardSec;
  t.avgHr=t.hrSecs>0?Math.round(t.hrWSum/t.hrSecs):0;
  t.kcalIsEstimate=t.kcal>0&&(t.kcalEstimated/t.kcal)>0.35;
  // Percentages are taken over MEASURED time only. Including unmonitored
  // sessions in the denominator would quietly deflate every share and make
  // the easy figure look worse the more strength work you did without a strap.
  if(t.hrSecs>0){
    // Largest-remainder allocation. Rounding each share independently can total
    // 101, and simply deriving the third as 100-a-b then yields a NEGATIVE share
    // (99s easy / 101s moderate / 0 hard rounds to 50 / 51 / -1). This gives
    // three non-negative integers that always total exactly 100.
    const pcts=sharesTo100([t.easySec,t.modSec,t.hardSec],t.hrSecs);
    t.easyPct=pcts[0]; t.modPct=pcts[1]; t.hardPct=pcts[2];
  }else{
    t.easyPct=null; t.modPct=null; t.hardPct=null;
  }
  t.hrCoveragePct=t.secs>0?clamp(Math.round(t.hrSecs/t.secs*100),0,100):null;
  return t;
}
function totalsForWeek(iso){
  const w=weekWindow(iso);
  return w?computeTotals(actsBetween(w.start,w.end)):computeTotals([]);
}
/**
 * Month totals = the union of the WEEKS that belong to this month, not the
 * calendar month. A week belongs to the month containing its Monday. This
 * guarantees the month cards and the week-by-week table always agree — a
 * calendar-month window would disagree with the sum of its own rows.
 */
function totalsForMonth(mk){
  const isos=weeksInMonth(mk);
  if(!isos.length) return computeTotals([]);
  const seen=new Set(); const acts=[];
  isos.forEach(iso=>{
    const win=weekWindow(iso); if(!win) return;
    actsBetween(win.start,win.end).forEach(a=>{
      if(seen.has(a.id)) return;
      seen.add(a.id); acts.push(a);
    });
  });
  return computeTotals(acts);
}

/**
 * Day-aligned week comparison — your 10-Aug note.
 * "hours exercised up to that day of that week, versus the rolling average of
 *  hours exercised up to that day of the week for the last four weeks"
 */
function dayAlignedComparison(weeksBack=4){
  const mon=mondayOf(new Date());
  const cutoff=elapsedWeekDays();

  const cur=weekToDateTotals();
  const prior=[];
  for(let i=1;i<=weeksBack;i++){
    const m=addDays(mon,-7*i);
    prior.push(computeTotals(actsBetween(m,addDays(m,cutoff))));
  }
  const avg=k=>prior.length?prior.reduce((s,t)=>s+(t[k]||0),0)/prior.length:0;
  // Easy share must be averaged across the weeks that actually HAVE HR data,
  // otherwise a strap-free week drags the baseline toward zero.
  const avgEasy=()=>{
    const v=prior.filter(t=>t.easyPct!=null).map(t=>t.easyPct);
    return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;
  };
  return {
    cur,
    avg:{ hrs:avg("hrs"), kcal:avg("kcal"), easyPct:avgEasy() },
    dayName: DAYS[clamp(cutoff-1,0,6)]
  };
}
/** Trailing N *complete* weeks — for rate metrics (pace, power). */
function trailingTotals(weeks=6){
  const mon=mondayOf(new Date());
  return computeTotals(actsBetween(addDays(mon,-7*weeks),mon));
}
/** Days elapsed in the current week, today inclusive (1..7). */
function elapsedWeekDays(){
  const now=new Date();
  const today=new Date(now); today.setHours(0,0,0,0);
  // Calendar-day arithmetic, not ms division — a DST shift would move this by a
  // day twice a year.
  return clamp(Math.round((today-mondayOf(now))/86400000)+1,1,7);
}
/**
 * This week UP TO TODAY. The dashboard says "this week so far", so every
 * "this week" number on it must use the same partial window — otherwise the
 * trend card and the intensity panel disagree while wearing the same label.
 */
function weekToDateTotals(){
  const mon=mondayOf(new Date());
  return computeTotals(actsBetween(mon,addDays(mon,elapsedWeekDays())));
}

/* ── plan adherence (your Q3: planned sessions ticked off) ── */
function adherence(week){
  const res={total:0,done:0,pct:0,byDisc:{},missed:[]};
  if(!week||!Array.isArray(week.planned)) return res;
  COUNTED.forEach(d=>{res.byDisc[d]={total:0,done:0};});
  week.planned.forEach(p=>{
    if(!COUNTED.includes(p.disc)) return;
    res.total++;
    res.byDisc[p.disc].total++;
    if(p.done){ res.done++; res.byDisc[p.disc].done++; }
    else res.missed.push(p);
  });
  res.pct=res.total?Math.round(res.done/res.total*100):0;
  return res;
}
function adhColor(pct){
  if(pct>=85) return "var(--good)";
  if(pct>=60) return "var(--warn)";
  return "var(--bad)";
}
function habitTotals(week){
  const r={cigs:0,drinks:0,cigDays:0,anyRecorded:false};
  if(!week||!week.habits) return r;
  DAYS.forEach(d=>{
    const h=week.habits[d]||{};
    if(h.cigs!=null){ r.cigs+=h.cigs; r.anyRecorded=true; if(h.cigs>0) r.cigDays++; }
    if(h.drinks!=null){ r.drinks+=h.drinks; r.anyRecorded=true; }
  });
  return r;
}

/* ════════════════════════════════════════════════════════════
   WEEK HELPERS
   ════════════════════════════════════════════════════════════ */
function ensureWeek(iso){
  if(!state.weeks[iso]){
    state.weeks[iso]=normWeek({date:iso},iso);
  }
  return state.weeks[iso];
}
/**
 * Fill in every Monday from the last recorded week through the end of the
 * current calendar year, so all remaining months exist and are navigable
 * without any manual "add week" step. Runs once per load; idempotent.
 */
function ensureYearScaffold(){
  const keys=sortedWeekKeys();
  // Start from the EARLIER of the last recorded week and this week, snapped to
  // Monday. Taking the earlier one means a stale log gets its gap filled so the
  // month views stay contiguous, and a stray far-future key can't stop the
  // scaffold from running at all.
  const seed=dateFromISO(keys.length?keys[keys.length-1]:thisMondayISO());
  if(!seed) return 0;
  const today=mondayOf(new Date());
  let d=mondayOf(seed<today?seed:today);
  // Always cover to year end, and never less than ~3 months ahead of today.
  const yearEnd=new Date(new Date().getFullYear(),11,31);
  const minHorizon=addDays(new Date(),91);
  const horizon=yearEnd>minHorizon?yearEnd:minHorizon;
  let created=0;
  while(d<=horizon){
    const iso=isoOf(d);
    if(!state.weeks[iso]){ ensureWeek(iso); created++; }
    d=addDays(d,7);
  }
  return created;
}
/** Current + next week — crosses month AND year boundaries cleanly (fixes M4). */
function currentAndNext(){
  const cur=thisMondayISO();
  const next=isoOf(addDays(dateFromISO(cur),7));
  return [cur,next];
}
function monthsWithData(){
  const set=new Set(sortedWeekKeys().map(monthKeyOf));
  set.add(monthKeyOf(thisMondayISO()));
  return Array.from(set).sort();
}
function weeksInMonth(mk){
  return sortedWeekKeys().filter(k=>monthKeyOf(k)===mk);
}

/* ════════════════════════════════════════════════════════════
   RENDER — router
   ════════════════════════════════════════════════════════════ */
function render(){
  if(viewMode==="home") renderHome();
  else renderMonth();
}
/** True while the caret is inside a week card. */
function isEditing(){
  const c=document.getElementById("weeks");
  return !!(c&&document.activeElement&&c.contains(document.activeElement));
}
/**
 * Re-render, but never yank the DOM out from under someone who is typing.
 * Async Strava callbacks land tens of seconds after load, so this matters.
 */
function renderSafe(){
  if(isEditing()){ _pendingRender=true; return; }
  _pendingRender=false;
  render();
}
document.addEventListener("focusout",()=>{
  if(!_pendingRender) return;
  setTimeout(()=>{ if(_pendingRender&&!isEditing()){ _pendingRender=false; render(); } },200);
});

/* ── HOME: analysis-first dashboard ── */
function renderHome(){
  viewMode="home";
  document.getElementById("homeBtn").classList.add("active");
  document.getElementById("monBtn").classList.remove("active");
  const v=document.getElementById("view");
  v.innerHTML="";

  const [curISO,nextISO]=currentAndNext();
  const prevISO=isoOf(addDays(dateFromISO(curISO),-7));
  const curWeek=getWeek(curISO), prevWeek=getWeek(prevISO);

  // Order: now → context → what to do → what just happened → history
  v.appendChild(el("div","sec-head","This week so far"));
  v.appendChild(buildTrendCards());
  v.appendChild(buildProgressPanel(curWeek,curISO));

  v.appendChild(el("div","sec-head","Intensity"));
  v.appendChild(buildIntensityPanel(curISO));

  v.appendChild(el("div","sec-head","This week & next"));
  v.appendChild(buildWeekCards([curISO,nextISO]));

  v.appendChild(el("div","sec-head","Last week"));
  v.appendChild(buildDebriefPanel(prevWeek,prevISO));

  v.appendChild(el("div","sec-head","Recent weeks"));
  v.appendChild(buildRollingTable(6));
}

function buildTrendCards(){
  const wrap=el("div","trends");
  const cmp=dayAlignedComparison(4);
  const trail=trailingTotals(6);

  const card=(label,val,subHtml,cls,estimated)=>{
    const c=el("div","trend-card "+(cls||"neutral"));
    c.appendChild(el("div","tc-label",label));
    const v=el("div","tc-val",val);
    if(estimated){ const b=el("span","tc-est","est"); v.appendChild(b); }
    c.appendChild(v);
    const s=el("div","tc-sub"); s.innerHTML=subHtml; c.appendChild(s);
    return c;
  };
  const dir=(cur,base,higherBetter=true)=>{
    if(!base) return "neutral";
    if(Math.abs(cur-base)/Math.max(base,1e-9)<0.03) return "neutral";
    return (cur>base)===higherBetter?"up":"down";
  };
  const upto=`by <b>${cmp.dayName}</b>`;

  if(!allActivities.length){
    wrap.appendChild(card("Weekly load","—","Connect Strava to see training data","neutral"));
    return wrap;
  }

  // 1. Hours — this week big, 4-wk day-aligned average small (your notes #14 + #16)
  {
    const d=pctDelta(cmp.cur.hrs,cmp.avg.hrs);
    wrap.appendChild(card("Training load",fmtHrs(cmp.cur.hrs),
      `${upto} · 4-wk avg <b>${fmtHrs(cmp.avg.hrs)}</b>`+(d!==null?` · ${signed(d)}%`:""),
      dir(cmp.cur.hrs,cmp.avg.hrs,true)));
  }
  // 2. Calories
  {
    const d=pctDelta(cmp.cur.kcal,cmp.avg.kcal);
    wrap.appendChild(card("Calories",cmp.cur.kcal?Math.round(cmp.cur.kcal).toLocaleString():"—",
      `${upto} · 4-wk avg <b>${Math.round(cmp.avg.kcal).toLocaleString()}</b>`+(d!==null?` · ${signed(d)}%`:""),
      dir(cmp.cur.kcal,cmp.avg.kcal,true), cmp.cur.kcalIsEstimate));
  }
  // 3. Run pace — this week big, trailing 6-wk small. Lower is better.
  {
    const cs=paceToSec(cmp.cur.runPace), ts=paceToSec(trail.runPace);
    let cls="neutral";
    if(cs&&ts) cls=cs<ts?"up":"down";
    wrap.appendChild(card("Run pace",cmp.cur.runPace,
      `min/km this week · 6-wk avg <b>${trail.runPace}</b>`,cls));
  }
  // 4. Swim pace
  {
    const cs=paceToSec(cmp.cur.swimPace), ts=paceToSec(trail.swimPace);
    let cls="neutral";
    if(cs&&ts) cls=cs<ts?"up":"down";
    wrap.appendChild(card("Swim pace",cmp.cur.swimPace,
      `/100m this week · 6-wk avg <b>${trail.swimPace}</b>`,cls));
  }
  // 5. Bike power
  {
    const c=cmp.cur.avgPower, t=trail.avgPower;
    wrap.appendChild(card("Bike power",c?c+"W":"—",
      `this week · 6-wk avg <b>${t?t+"W":"—"}</b>`,dir(c,t,true)));
  }
  // 6. Easy share (v36) — the share of measured time spent genuinely easy.
  {
    const c=cmp.cur.easyPct, base=cmp.avg.easyPct, t=trail.easyPct;
    // Colour against the 80% target, not against last month. Drifting from
    // 30% to 35% is not "up" in any sense that matters.
    let cls="neutral";
    if(c!=null) cls = c>=EASY_TARGET_PCT ? "up" : (c<60?"down":"neutral");
    const parts=[`of measured time · target <b>${EASY_TARGET_PCT}%</b>`];
    if(t!=null) parts.push(`6-wk <b>${t}%</b>`);
    else if(base!=null) parts.push(`4-wk <b>${base}%</b>`);
    wrap.appendChild(card("Easy share",c!=null?c+"%":"—",parts.join(" · "),cls));
  }
  return wrap;
}

/**
 * Intensity distribution (v36) — this week and the trailing 6 weeks, with the
 * 80/20 reference. Answers the one question a weekly hours figure cannot:
 * is the easy work actually easy?
 */
function buildIntensityPanel(iso){
  const p=el("div","panel");
  p.appendChild(Object.assign(el("h3"),{textContent:"Intensity distribution"}));

  if(!allActivities.length){
    p.appendChild(el("div","muted","Connect Strava to see intensity data."));
    return p;
  }

  const bar=(t,label)=>{
    const box=el("div");
    const head=el("div","int-target");
    if(t.easyPct==null){
      head.textContent=label+" — no heart-rate data";
      box.appendChild(head);
      return box;
    }
    head.innerHTML=`<b>${esc(label)}</b> · ${fmtHrs(t.hrSecs/3600)} measured`+
      (t.hrCoveragePct!=null&&t.hrCoveragePct<100
        ? ` · ${t.hrCoveragePct}% of session time had a strap` : "");
    box.appendChild(head);

    const b=el("div","int-bar");
    [["easy",t.easyPct,"int-easy"],["mod",t.modPct,"int-mod"],["hard",t.hardPct,"int-hard"]]
      .forEach(([k,pct,cls])=>{
        if(!pct) return;                        // 0% segments would render as slivers
        const seg=el("div","int-seg "+cls,pct>=8?pct+"%":"");
        seg.style.width=pct+"%";
        seg.title=k+": "+pct+"%";
        b.appendChild(seg);
      });
    box.appendChild(b);
    return box;
  };

  // Same partial-week window as the trend cards above, so the two agree.
  const trail=trailingTotals(TRAIL_WEEKS);
  p.appendChild(bar(weekToDateTotals(),"This week so far"));
  p.appendChild(bar(trail,`Trailing ${TRAIL_WEEKS} weeks`));

  const lg=el("div","int-legend");
  const eM=hrEasyMax(), hM=hrHardMin();
  // hM is guaranteed > eM, but they can be adjacent, which leaves no moderate
  // band at all — printing "Moderate 141-140" would look like a bug.
  const modLabel = hM-eM>1 ? `Moderate ${eM+1}\u2013${hM-1}` : "Moderate — none (bands adjacent)";
  lg.innerHTML=
    `<div><span class="k" style="background:var(--good)"></span>Easy \u2264${eM} bpm</div>`+
    `<div><span class="k" style="background:var(--warn)"></span>${modLabel}</div>`+
    `<div><span class="k" style="background:var(--bad)"></span>Hard \u2265${hM} bpm</div>`;
  p.appendChild(lg);

  // Per-discipline easy share over the same trailing window — a single overall
  // figure hides the problem, because one sport can be fine while another is
  // entirely in the red.
  const mon=mondayOf(new Date());
  const trailActs=actsBetween(addDays(mon,-7*TRAIL_WEEKS),mon);
  const rows=[];
  [["run",RUN_TYPES],["bike",BIKE_TYPES],["swim",SWIM_TYPES]].forEach(([d,types])=>{
    const t=computeTotals(trailActs.filter(a=>types.has(sportOf(a))));
    if(t.easyPct!=null) rows.push([DISC[d].label,t.easyPct,t.hrSecs/3600]);
  });
  if(rows.length){
    const tb=el("table","dtable");
    tb.innerHTML=`<thead><tr><th>${TRAIL_WEEKS}-wk by sport</th><th>Easy</th><th>Hours w/ HR</th></tr></thead>`;
    const body=el("tbody");
    rows.forEach(([l,pct,hrs])=>{
      const tr=el("tr");
      const col=pct>=EASY_TARGET_PCT?"var(--good)":(pct<40?"var(--bad)":"var(--warn)");
      tr.innerHTML=`<td>${esc(l)}</td>`+
        `<td style="color:${col};font-weight:700">${pct}%</td>`+
        `<td>${fmtHrs(hrs)}</td>`;
      body.appendChild(tr);
    });
    tb.appendChild(body); p.appendChild(tb);
  }

  const note=el("div","int-note");
  note.textContent=
    "How this is measured: Strava reports one average heart rate per activity, not a "+
    "zone histogram, so each session is classified by its average and the whole session "+
    "counts toward that bucket. This reads HARSHER than a true time-in-zone figure — a "+
    "run averaging 165 counts as fully hard here, while a watch would credit the "+
    "warm-up and cool-down minutes as easy. Do not compare these percentages to the "+
    "ones in Garmin; compare them to last month's. The metric still answers the "+
    "question it exists for, because a genuinely easy session has a genuinely low "+
    "average and will land in the easy bucket. Thresholds are editable from the header.";
  p.appendChild(note);
  return p;
}

function buildRollingTable(n){
  const p=el("div","panel");
  p.appendChild(Object.assign(el("h3"),{textContent:`Last ${n} weeks`}));
  const tb=el("table","dtable");
  tb.innerHTML="<thead><tr><th>Week</th><th>Adher.</th><th>Hours</th><th>Kcal</th>"+
    "<th>Bike km</th><th>Run km</th><th>Swim m</th><th>Avg HR</th><th>Easy</th></tr></thead>";
  const body=el("tbody");
  const mon=mondayOf(new Date());
  let sH=0,sC=0,sB=0,sR=0,sS=0;
  for(let i=n-1;i>=0;i--){
    const iso=isoOf(addDays(mon,-7*i));

    const a=adherence(getWeek(iso));
    sH+=t.hrs; sC+=t.kcal; sB+=t.bikeKm; sR+=t.runKm; sS+=t.swimM;
    const tr=el("tr"); if(i===0) tr.className="this-wk";
    tr.innerHTML=
      `<td>${i===0?"This week":esc(weekLabel(iso))}</td>`+
      `<td>${a.total?a.pct+"%":"—"}</td>`+
      `<td>${fmtHrs(t.hrs)}</td>`+
      `<td>${t.kcal?Math.round(t.kcal).toLocaleString():"—"}</td>`+
      `<td>${t.bikeKm>0?t.bikeKm.toFixed(0):"—"}</td>`+
      `<td>${t.runKm>0?t.runKm.toFixed(1):"—"}</td>`+
      `<td>${t.swimM>0?Math.round(t.swimM):"—"}</td>`+
      `<td>${t.avgHr?t.avgHr:"—"}</td>`+
      (t.easyPct==null
        ? `<td>—</td>`
        : `<td style="color:${t.easyPct>=EASY_TARGET_PCT?"var(--good)":(t.easyPct<40?"var(--bad)":"var(--warn)")}">${t.easyPct}%</td>`);

    `<td></td><td></td>`;
  body.appendChild(tot);
  tb.appendChild(body); p.appendChild(tb);
  return p;
}

      `<td>${sR.toFixed(1)}</td><td>${Math.round(sS)}</td><td>${anyCig?sCig:"—"}</td>`;

/* ── week cards ── */
/** Returns the week-cards container so callers can place it anywhere in the page. */
function buildWeekCards(isoList){
  const c=el("div","weeks");
  c.id="weeks";                       // isEditing() looks this up
  (isoList||[]).forEach(iso=>{
    // Rendering must not mutate state. A transient week object is rendered for a
    // date that has no record yet; it only becomes real when the user edits it.
    const w=getWeek(iso)||normWeek({date:iso},iso);
    c.appendChild(weekCard(w));
  });
  return c;
}
function weekCard(w){
  // Weeks are never collapsible — always fully expanded, per the "no collapsible
  // weeks" note. This also removes a whole class of stale-state bugs.
  const box=el("div","week");
  box.dataset.week=w.date;

  /* head — built with DOM nodes, never innerHTML (closes the v34 injection vector) */
  const head=el("div","wk-head");
  const dwrap=el("div");
  dwrap.appendChild(el("div","wk-date",weekLabel(w.date)));
  dwrap.appendChild(el("div","wk-sub",dateFromISO(w.date)?dateFromISO(w.date).getFullYear():""));
  head.appendChild(dwrap);

  const meta=el("div","wk-meta");
  const a=adherence(w);
  if(a.total) meta.appendChild(el("span","wk-progress",`${a.done}/${a.total}`));
  head.appendChild(meta);
  box.appendChild(head);

  const body=el("div","wk-body");
  const cols=el("div","wk-cols");

  /* left — plan */
  const L=el("div");
  L.appendChild(el("div","wk-col-head","Planned"));
  const list=el("div","plan");
  w.planned.forEach(p=>list.appendChild(plannedRow(p)));
  L.appendChild(list);
  const add=el("button","add-sess","+ session");
  add.dataset.action="add-sess";
  L.appendChild(add);
  cols.appendChild(L);

  /* right — Strava */
  const R=el("div");
  const acts=weekActivities(w.date);
  R.appendChild(el("div","wk-col-head","Strava"+(stravaToken?` (${acts.length})`:"")));
  const ac=el("div","strava-activities");
  if(!stravaToken) ac.appendChild(el("div","strava-loading","Connect Strava to sync."));
  else if(!acts.length) ac.appendChild(el("div","strava-loading","No activities this week."));
  acts.forEach(x=>ac.appendChild(activityCard(x)));
  R.appendChild(ac);
  cols.appendChild(R);
  body.appendChild(cols);

  /* comments */
  const cw=el("div","comments-wrap");
  const cl=el("div","wk-col-head","Comments");
  cl.style.marginTop="14px";
  cw.appendChild(cl);
  const ta=el("textarea");
  ta.dataset.field="comments";
  ta.placeholder="How the week felt…";
  ta.value=w.comments||"";
  ta.addEventListener("input",()=>autoGrow(ta));
  cw.appendChild(ta);
  requestAnimationFrame(()=>autoGrow(ta));
  body.appendChild(cw);

  /* habits — now available on every week */
  body.appendChild(habitsTable(w));

  box.appendChild(body);
  return box;
}
function plannedRow(p){
  const r=el("div","pitem"+(p.done?" done":""));
  r.dataset.item=p.id;
  const d=discMeta(p.disc);

  const cb=el("input","check");
  cb.type="checkbox"; cb.checked=!!p.done; cb.dataset.action="toggle";
  r.appendChild(cb);

  const chip=el("button","chip",d.label);
  chip.style.background=d.c; chip.dataset.action="cycle";
  r.appendChild(chip);

  const tx=el("input","ptext");
  tx.value=p.text||""; tx.dataset.field="ptext";
  tx.placeholder="Session…";
  r.appendChild(tx);

  const del=el("button","del","×");
  del.dataset.action="del-sess";
  r.appendChild(del);
  return r;
}

    [["cigs",h.cigs],["drinks",h.drinks]].forEach(([k,val])=>{
      const td=el("td");
      const i=el("input","habit-inp");
      i.type="text"; i.inputMode="numeric"; i.placeholder="—";
      i.value=(val==null?"":String(val));
      i.dataset.field="habit"; i.dataset.htype=k; i.dataset.day=day;
      td.appendChild(i); tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  const t=habitTotals(w);
  if(t.anyRecorded){
    const tf=el("tfoot");
    const tr=el("tr");
    tr.appendChild(el("td",null,"Tot"));
    tr.appendChild(el("td",null,String(t.cigs)));
    tr.appendChild(el("td",null,String(t.drinks)));
    tf.appendChild(tr); tbl.appendChild(tf);
  }
  hw.appendChild(tbl);
  return hw;
}
function weekActivities(iso){
  const win=weekWindow(iso);
  if(!win) return [];
  return actsBetween(win.start,win.end).sort((a,b)=>actDate(a)-actDate(b));
}
/** Which intensity bucket a single activity's average HR falls in (v36). */
function hrZoneOf(a){
  const hr=a&&a.average_heartrate;
  if(!(hr>0)) return null;
  if(hr<=hrEasyMax()) return {key:"easy",label:"EASY",cls:"z-easy"};
  if(hr>=hrHardMin()) return {key:"hard",label:"HARD",cls:"z-hard"};
  return {key:"mod",label:"MOD",cls:"z-mod"};
}
function activityCard(a){
  const sport=a.sport_type||a.type||"Workout";
  const card=el("div","act-card");
  const bar=el("div","act-disc"); bar.style.background=discColor(sport);
  card.appendChild(bar);

  const bd=el("div","act-body");
  bd.appendChild(el("div","act-name",a.name||sport));
  const meta=el("div","act-meta");

  const dist=a.distance||0, time=a.moving_time||0, elev=a.total_elevation_gain||0;
  const hr=a.average_heartrate||null;
  const cal=activityCalories(a);

  const stat=(v,l,est)=>{
    const s=el("span","act-stat"+(est?" est":""));
    const b=el("b",null,v); s.appendChild(b);
    s.appendChild(document.createTextNode(" "+l));
    return s;
  };
  if(dist>0) meta.appendChild(stat(fmtDist(dist,sport),"dist"));
  if(time>0) meta.appendChild(stat(fmtTime(time),"time"));
  if(elev>10) meta.appendChild(stat(Math.round(elev)+"m","elev"));
  if(hr){
    const z=hrZoneOf(a);
    const s=stat(Math.round(hr)+" bpm","HR");
    if(z){
      const chip=el("span","zchip "+z.cls,z.label);
      chip.title="Average HR "+Math.round(hr)+" bpm · easy \u2264"+hrEasyMax()+
                 ", hard \u2265"+hrHardMin();
      s.appendChild(chip);
    }
    meta.appendChild(s);
  }
  if(cal.kcal>0) meta.appendChild(stat(cal.kcal+" kcal",cal.est?"est":"cal",cal.est));
  if(RUN_TYPES.has(sport)&&dist>0&&time>0) meta.appendChild(stat(fmtPace(dist,time)+"/km","pace"));
  if(SWIM_TYPES.has(sport)&&dist>0&&time>0) meta.appendChild(stat(fmtPaceSwim(dist,time)+"/100m","pace"));
  if(a.average_watts>0&&BIKE_TYPES.has(sport)) meta.appendChild(stat(Math.round(a.average_watts)+"W","pwr"));
  bd.appendChild(meta);
  card.appendChild(bd);

  const d=actDate(a);
  card.appendChild(el("div","act-date",d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric"})));
  return card;
}

function buildMonthMenu(){
  const menu=document.getElementById("monMenu");
  menu.innerHTML="";
  const months=monthsWithData();
  const nowMk=monthKeyOf(thisMondayISO());
  let lastYear=null;
  months.slice().reverse().forEach(mk=>{
    const yr=mk.slice(0,4);
    if(yr!==lastYear){
      menu.appendChild(el("div","mon-yr",yr));
      lastYear=yr;
    }
    const n=weeksInMonth(mk).length;
    const o=el("div","mon-opt"+(mk===currentMonth?" active":""));
    o.appendChild(document.createTextNode(MONTH_NAMES[parseInt(mk.slice(5,7),10)-1]));
    const s=el("small",null,mk===nowMk?"current":(n+" wks"));
    o.appendChild(s);
    o.dataset.month=mk;
    menu.appendChild(o);
  });
}

/* week actions */
document.addEventListener("click",e=>{
  const act=e.target.closest("[data-action]");
  if(!act) return;
  const a=act.dataset.action;

  const weekEl=act.closest("[data-week]");
  if(!weekEl) return;
  // Explicit user action on this week — materialise it if it was only a placeholder.
  const w=ensureWeek(weekEl.dataset.week);
  if(!w) return;

  if(a==="toggle"){
    const row=act.closest("[data-item]"); if(!row) return;
    const it=w.planned.find(p=>p.id===row.dataset.item); if(!it) return;
    it.done=act.checked;
    row.classList.toggle("done",it.done);
    refreshProgress(weekEl,w);
    schedule();
  }
  else if(a==="cycle"){
    const row=act.closest("[data-item]"); if(!row) return;
    const it=w.planned.find(p=>p.id===row.dataset.item); if(!it) return;
    const ci=CYCLE.indexOf(it.disc);
    it.disc=CYCLE[ci<0?0:(ci+1)%CYCLE.length];   // unknown disc -> start of cycle
    const d=discMeta(it.disc);
    act.style.background=d.c; act.textContent=d.label;
    refreshProgress(weekEl,w);
    schedule();
  }
  else if(a==="del-sess"){
    const row=act.closest("[data-item]"); if(!row) return;
    w.planned=w.planned.filter(p=>p.id!==row.dataset.item);
    row.remove();
    refreshProgress(weekEl,w);
    schedule();
  }
  else if(a==="add-sess"){
    const it={id:uid(),disc:"run",text:"",done:false};
    w.planned.push(it);
    const list=weekEl.querySelector(".plan");
    if(list){
      const row=plannedRow(it);
      list.appendChild(row);
      const inp=row.querySelector(".ptext"); if(inp) inp.focus();
    }
    refreshProgress(weekEl,w);
    schedule();
  }
});
/** Update only the affected bits — avoids destroying in-flight edits (fixes M7). */
function refreshProgress(weekEl,w){
  const a=adherence(w);
  const pr=weekEl.querySelector(".wk-progress");
  if(!a.total){ if(pr) pr.remove(); return; }      // no countable sessions -> no badge
  if(pr) pr.textContent=`${a.done}/${a.total}`;
  else{
    const meta=weekEl.querySelector(".wk-meta");
    if(meta) meta.insertBefore(el("span","wk-progress",`${a.done}/${a.total}`),meta.firstChild);
  }
}

document.addEventListener("input",e=>{
  const f=e.target.closest("[data-field]"); if(!f) return;
  const weekEl=f.closest("[data-week]"); if(!weekEl) return;
  const w=ensureWeek(weekEl.dataset.week); if(!w) return;
  const key=f.dataset.field;

  if(key==="ptext"){
    const row=f.closest("[data-item]"); if(!row) return;
    const it=w.planned.find(p=>p.id===row.dataset.item);
    if(it) it.text=f.value;
  }
  else if(key==="comments"){ w.comments=f.value; }
  else if(key==="habit"){
    if(!w.habits) w.habits=emptyHabits();
    if(!w.habits[f.dataset.day]) w.habits[f.dataset.day]={cigs:null,drinks:null};
    w.habits[f.dataset.day][f.dataset.htype]=parseHabit(f.value);
  }
  schedule();
});

function updateExportBtn(){
  const b=document.getElementById("exportBtn");
  if(b){
    // Always available — the plan, habits and comments are worth exporting even
    // with no Strava connection.
    b.textContent=allActivities.length
      ? "↓ Export JSON · "+allActivities.length+" activities"
      : "↓ Export JSON";
    b.style.display="block";
  }
  // .export-btn is display:none in CSS and only revealed here. Import must be
  // revealed by the same call or the button exists but is never visible.
  const i=document.getElementById("importBtn");
  if(i) i.style.display=_loadOk?"block":"none";   // hidden outright when writes are blocked
}
function exportJSON(){
  const weeks=state.weeks;
  const months={};
  Object.keys(weeks).sort().forEach(iso=>{
    const mk=monthKeyOf(iso);
    if(!months[mk]) months[mk]={month:mk,label:monthLabel(mk),weeks:[]};
    const t=totalsForWeek(iso), a=adherence(weeks[iso]), h=habitTotals(weeks[iso]);
    months[mk].weeks.push({
      week:iso, isRace:weeks[iso].isRace,
      adherencePct:a.total?a.pct:null, planned:a.total, completed:a.done,
      hours:+t.hrs.toFixed(2), kcal:Math.round(t.kcal), kcalIsEstimate:t.kcalIsEstimate,
      bikeKm:+t.bikeKm.toFixed(2), runKm:+t.runKm.toFixed(2), swimM:Math.round(t.swimM),
      sessions:t.count, avgPower:t.avgPower, avgHr:t.avgHr,
      runPace:t.runPace, swimPace:t.swimPace,
      cigarettes:h.anyRecorded?h.cigs:null, drinks:h.anyRecorded?h.drinks:null
    });
  });
  const payload={
    exportedAt:new Date().toISOString(),
    schemaVersion:SCHEMA_VERSION,
    state,                       // raw weeks — full fidelity
    derived:{months},            // computed rollups for analysis
    calorieCache:calCache,
    activities:allActivities
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const d=new Date();
  a.href=url;
  a.download=`training-log-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
}
document.getElementById("exportBtn").addEventListener("click",exportJSON);

/* ════════════════════════════════════════════════════════════
   IMPORT (v36) — merge a plan file into state.weeks
   Accepts a bare weeks map {"2026-08-17":{...}}, a full export payload
   ({state:{weeks:{...}}}), or a loose {weeks:{...}}.

   Deliberately narrow: for a week that already exists this replaces `planned`
   and NOTHING else. Comments and habit entries are yours, written by hand, and
   a plan file has no business touching them — so importing the wrong file
   costs you a plan, never your notes.
   ════════════════════════════════════════════════════════════ */
function extractWeeksMap(raw){
  const cand = (raw&&raw.state&&raw.state.weeks) ? raw.state.weeks
             : (raw&&raw.weeks)                  ? raw.weeks
             : raw;
  if(!cand||typeof cand!=="object"||Array.isArray(cand)) return null;
  const keys=Object.keys(cand).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k));
  return keys.length?{map:cand,keys}:null;
}
async function importPlan(file){
  if(!_loadOk){
    banner("Editing is disabled this session because your data could not be read. "+
           "Nothing was imported. Please reload.",true);
    return;
  }
  let raw;
  try{
    raw=JSON.parse(await file.text());
  }catch(e){
    banner("That file is not valid JSON, so nothing was imported.",true);
    return;
  }
  const found=extractWeeksMap(raw);
  if(!found){
    banner("No weeks found. Expected an object keyed by Monday dates "+
           "(\"YYYY-MM-DD\"), or a full export containing state.weeks.",true);
    return;
  }

  let added=0, updated=0, sessions=0, snapped=0, skipped=0, collided=0;
  const seen=new Set();
  found.keys.forEach(k=>{
    const d=dateFromISO(k);
    if(!d){ skipped++; return; }
    const iso=isoOf(mondayOf(d));
    if(iso!==k) snapped++;                      // a non-Monday key gets snapped, as elsewhere
    // Two keys in the same file can snap to one Monday. normState resolves that
    // with "first one wins"; import must agree, or which plan you get depends on
    // key iteration order.
    if(seen.has(iso)){ collided++; return; }
    seen.add(iso);
    // normWeek coerces every field and drops anything unrecognised, so a
    // malformed file cannot put bad shapes into state.
    const incoming=normWeek(found.map[k],iso);
    const existing=state.weeks[iso];
    if(existing){
      existing.planned=incoming.planned;        // plan only — see the note above
      updated++;
    }else{
      state.weeks[iso]=incoming;
      added++;
    }
    sessions+=incoming.planned.length;
  });

  if(!added&&!updated){ banner("Nothing in that file could be read as a week.",true); return; }

  const saved=await persist(true);
  const bits=[`Imported ${sessions} session${sessions===1?"":"s"} across `+
              `${added+updated} week${added+updated===1?"":"s"} `+
              `(${added} new, ${updated} updated).`,
              "Comments and habits untouched."];
  if(snapped)  bits.push(`${snapped} key${snapped===1?"":"s"} snapped to its Monday.`);
  if(collided) bits.push(`${collided} duplicate week${collided===1?"":"s"} ignored (first wins).`);
  if(skipped)  bits.push(`${skipped} unreadable date${skipped===1?"":"s"} skipped.`);
  if(!saved)  bits.push("NOT SAVED to the cloud — kept locally, see the console.");
  banner(bits.join(" "),!saved);

  buildMonthMenu();                             // new months may now exist
  renderSafe();                                 // never yank the DOM from a caret
}
document.getElementById("importBtn").addEventListener("click",()=>{
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value="";                            // so re-picking the same file fires again
  if(f) importPlan(f);
});

/* Body weight — drives the MET fallback for activities Strava gives no calories for. */
function updateWeightBtn(){
  const b=document.getElementById("weightBtn"); if(!b) return;
  b.textContent=((state.settings&&state.settings.weightKg)||75)+" kg";
}
document.getElementById("weightBtn").addEventListener("click",()=>{
  const cur=(state.settings&&state.settings.weightKg)||75;
  const v=prompt("Body weight in kg (used to estimate calories where Strava gives none):",String(cur));
  if(v==null) return;
  const n=Number(String(v).replace(",","."));
  if(!isFinite(n)||n<=25||n>=250){ flash("Enter a weight between 25 and 250 kg",true); return; }
  state.settings.weightKg=Math.round(n*10)/10;
  updateWeightBtn(); schedule(); render();
});

/* Heart-rate thresholds — drive the easy / moderate / hard split. */
function updateHrBtn(){
  const b=document.getElementById("hrBtn"); if(!b) return;
  b.textContent="HR "+hrEasyMax()+"/"+hrHardMin();
}
document.getElementById("hrBtn").addEventListener("click",()=>{
  const e0=hrEasyMax(), h0=hrHardMin();
  const e=prompt("Easy ceiling in bpm — sessions averaging at or below this count as easy:",String(e0));
  if(e==null) return;
  const en=Math.round(Number(String(e).replace(",",".")));
  if(!isFinite(en)||en<80||en>200){ flash("Enter an easy ceiling between 80 and 200 bpm",true); return; }
  const h=prompt("Hard floor in bpm — sessions averaging at or above this count as hard:",String(Math.max(h0,en+1)));
  if(h==null) return;
  const hn=Math.round(Number(String(h).replace(",",".")));
  if(!isFinite(hn)||hn<=en||hn>230){ flash("Hard floor must be above the easy ceiling and at most 230 bpm",true); return; }
  state.settings.hrEasyMax=en;
  state.settings.hrHardMin=hn;
  updateHrBtn(); schedule(); render();
});

window.addEventListener("beforeunload",()=>{
  flushPending();                       // don't lose an edit made inside the debounce window
  if(_cacheDirty) saveCalCache();
});

onAuthStateChanged(_auth,async user=>{
  const gate=document.getElementById("authGate");
  const bar=document.getElementById("userBar");
  if(!user){
    gate.style.display="flex"; bar.style.display="none"; _authed=false;
    return;
  }
  gate.style.display="none"; bar.style.display="flex";
  document.getElementById("userAvatar").src=user.photoURL||"";
  document.getElementById("userEmail").textContent=user.displayName||user.email;
  if(_authed) return;
  _authed=true;

  await loadState();
  await loadCalCache();

  // Scaffold the remaining months of the year so every month is navigable
  // without a manual "add week" step.
  if(_loadOk && ensureYearScaffold()>0) schedule();

  currentMonth=monthKeyOf(thisMondayISO());
  document.getElementById("monLabel").textContent=monthLabel(currentMonth);
  updateWeightBtn();
  updateHrBtn();
  updateExportBtn();          // export must work without Strava
  buildMonthMenu();
  renderHome();

  const code=new URLSearchParams(location.search).get("code");
  if(code){
    if(await stravaExchangeCode(code)) await fetchStravaActivities();
    else showConnect(true);
  }else if(await stravaEnsureToken()){
    await fetchStravaActivities();
  }else{
    showConnect(true);
    refreshStatus();
  }
});
